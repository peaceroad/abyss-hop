<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔女の降下 - Witch Hop</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, #2a1245 0%, #12071f 45%, #05010a 100%);
    color: #ffe9d6;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #game-wrapper {
    position: relative;
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    aspect-ratio: 4 / 3;
    box-sizing: border-box;
    background: #05010a;
    box-shadow: 0 0 60px rgba(255, 120, 0, 0.16), 0 0 140px rgba(140, 40, 220, 0.14);
    border: 2px solid #3d1c5c;
    border-radius: 10px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
  #focus-hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(26, 8, 42, 0.9);
    border: 1px solid #7a3ca8;
    padding: 12px 20px; border-radius: 6px;
    font-size: 14px; color: #e0b6ff;
    pointer-events: none; opacity: 0;
    transition: opacity 0.3s; z-index: 10;
  }
  #focus-hint.show { opacity: 1; }
  #manual-link, #abyss-link {
    position: absolute; bottom: 10px; z-index: 6;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px; text-decoration: none;
    letter-spacing: 0.06em;
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s;
  }
  #manual-link {
    right: 10px;
    border: 1px solid rgba(255, 150, 60, 0.55);
    background: rgba(30, 10, 45, 0.78);
    color: #ffc98a;
  }
  #manual-link:hover { background: rgba(50, 18, 70, 0.92); color: #ffe3bf; }
  #abyss-link {
    left: 10px;
    border: 1px solid rgba(90, 180, 255, 0.45);
    background: rgba(8, 18, 34, 0.78);
    color: #9fd4ff;
  }
  #abyss-link:hover { background: rgba(12, 28, 52, 0.92); color: #d0ebff; }
  #manual-link.show, #abyss-link.show { opacity: 1; visibility: visible; }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas" tabindex="0"></canvas>
  <div id="focus-hint">ゲーム画面をクリックして操作</div>
  <a id="abyss-link" href="../abyss-hop.html">🐟 深海版で遊ぶ</a>
  <a id="manual-link" href="manual.html" target="_blank" rel="noopener">📖 遊び方・説明書</a>
</div>
<script>
(() => {
  "use strict";

  // ===================== Configuration =====================
  const CFG = {
    logicWidth: 800,
    logicHeight: 600,
    gravity: 1800,
    hopVel: -650,
    diveVel: 520,
    moveAccel: 800,
    maxRunSpeed: 220,
    friction: 0.82,
    airDrag: 0.96,
    scrollBase: 96,
    scrollMax: 280,
    scrollRamp: 0.004,
    cameraMarginTop: 120,
    cameraMarginBottom: 60,

    // 静的障害物：墓石
    tombRadius: 14,
    tombEmojiSize: 30,

    // コウモリ（水平遊泳）
    batRadius: 14,
    batEmojiSize: 30,

    // フランケンシュタイン（足場這い）
    frankRadius: 14,
    frankEmojiSize: 30,

    // 蜘蛛（足場這い・高速・乗り移り）
    spiderRadius: 11,
    spiderEmojiSize: 24,

    // 黒猫（正弦波遊泳）
    blackCatRadius: 15,
    blackCatEmojiSize: 32,
    blackCatAmp: 26,
    blackCatFreq: 3.2,

    // ジャック・オー・ランタン（巨大）
    pumpkinRadius: 48,
    pumpkinEmojiSize: 104,
    pumpkinHp: 3,

    // 幽霊（膨縮遊泳）
    ghostEmojiSize: 60,
    ghostBaseScale: 0.62,
    ghostMaxScale: 1.0,
    ghostRadiusMin: 17,
    ghostRadiusMax: 28,
    ghostSpeed: 105,
    ghostBreath: 0.9,

    // プレイヤー
    playerW: 34,
    playerH: 26,
    playerHitShrink: 3,
    playerEmojiSize: 32,

    introDuration: 0.28,
    safeStartTime: 3.2,
    diveIgnoreTime: 0.18,
    maxDt: 0.033,
    accumulatorMax: 0.1,
    emberCount: 30,
    dangerEmberCount: 14,
    scrollUnit: 120,
    enemySafeDist: 145,
    startBannerTime: 0.85,
    startInvulnTime: 0.65,
    gameOverFallGravity: 1700,
    gameOverFallSpin: 5.2,
    firstEnemyTime: 2.0,
    firstFrankTime: 2.4,
    firstBatTime: 2.8,
    maxTombs: 256,
    maxFranks: 256,
    maxSpiders: 256,
    maxBats: 256,
    maxBlackCats: 256,
    maxGhosts: 256,
    maxPumpkins: 256,

    // 深度解禁（40m までに全敵が出揃う）
    firstSpiderDepth: 10,
    firstBlackCatDepth: 20,
    firstGhostDepth: 30,
    firstPumpkinDepth: 40,

    // お菓子アイテム
    powerupEmojiSize: 30,
    powerupRadius: 15,
    chocolateEmojiSize: 28,
    chocolateRadius: 14,
    wrappedEmojiSize: 26,
    wrappedRadius: 13,
    itemPickupParticles: 14,
    firstItemDepth: 4,
    itemDepthStep: 8,

    // 🍭 全方位の星
    starDuration: 12,
    starEmitInterval: 0.09,
    starEmitPerTick: 2,
    starSpeed: 150,
    starRange: 108,
    starRadius: 12,
    star1EmojiSize: 22,
    star2EmojiSize: 37,
    maxStars: 64,

    // 🍬 前方60度の炎
    flameDuration: 10,
    flameEmitInterval: 0.10,
    flameEmitPerTick: 2,
    flameSpeed: 300,
    flameRadius: 11,
    flameLife: 1.15,
    flameSpread: Math.PI / 3,
    flameEmojiSize: 26,
    maxFlames: 48,

    // 🍫 淡いシールド
    shieldInvulnTime: 2.0,
    shieldRadius: 26,

    // 🔮 水晶玉（まれ）＋雷
    crystalEmojiSize: 30,
    crystalRadius: 15,
    crystalChance: 0.18,
    thunderDuration: 1.8,
    thunderIntervalMin: 0.085,
    thunderIntervalMax: 0.155,
    boltLife: 0.3,
    boltHalfWidth: 34,
  };

  // ===================== DOM =====================
  const canvas = document.getElementById("gameCanvas");
  const wrapper = document.getElementById("game-wrapper");
  const focusHint = document.getElementById("focus-hint");
  const manualLink = document.getElementById("manual-link");
  const abyssLink = document.getElementById("abyss-link");
  const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

  // ===================== State =====================
  let state = "title";
  let lastTime = 0;
  let acc = 0;
  let animTime = 0;
  let focus = false;
  let bestDepth = 0;
  let shake = 0;
  let dim = 0;
  let flash = 0;
  let topDanger = 0;
  let deathWitch = null;
  let helpVisible = true;
  let helpTimer = 0;

  const keys = new Set();
  const latched = { p: false, n: false };

  let worldScroll = 0;
  let maxScroll = 0;
  let scrollSpeed = CFG.scrollBase;
  let introTimer = 0;
  let playTime = 0;
  let startBannerTimer = 0;
  let invulnTimer = 0;

  let player = null;
  let platforms = [];
  let tombs = [];
  let powerups = [];
  let stars = [];
  let flames = [];
  let bats = [];
  let franks = [];
  let spiders = [];
  let blackCats = [];
  let ghosts = [];
  let pumpkins = [];
  let embers = [];
  let dangerEmbers = [];
  let particles = [];
  let bolts = [];
  let thunderTimer = 0;
  let thunderTick = 0;

  let cameraY = 0;
  let generatedUntil = 0;
  let startPlatform = null;
  let nextItemDepth = CFG.firstItemDepth;
  let itemIndex = 0;

  let bgProps = [];
  let skyStars = [];

  // ===================== localStorage =====================
  function loadBest() {
    try {
      const v = localStorage.getItem("witchhop_best_depth");
      if (v) bestDepth = Math.max(0, parseInt(v, 10) || 0);
    } catch (e) { bestDepth = 0; }
  }
  function saveBest() {
    try { localStorage.setItem("witchhop_best_depth", String(bestDepth)); } catch (e) {}
  }
  loadBest();

  // ===================== Sprite cache =====================
  const SPRITES = {};
  let spriteScale = 0;
  let bgGradient = null;
  let dangerGradient = null;
  let vignetteGrad = null;
  let moonGrad = null;
  let pumpkinGlowGrad = null;

  function makeSprite(emoji, fontSize, glowPasses, outline) {
    const ss = spriteScale;
    let maxBlur = 0;
    if (glowPasses) for (const g of glowPasses) maxBlur = Math.max(maxBlur, g.blur);
    const pad = maxBlur + 9 + (outline ? (outline.width || 2) : 0);
    const size = fontSize + pad * 2;
    const px = Math.max(1, Math.round(size * ss));
    const c = size / 2;

    function blank() {
      const el = document.createElement("canvas");
      el.width = px;
      el.height = px;
      const o = el.getContext("2d");
      o.setTransform(ss, 0, 0, ss, 0, 0);
      o.textAlign = "center";
      o.textBaseline = "middle";
      o.font = fontSize + "px sans-serif";
      return { el, o };
    }

    // 本体だけ（輪郭シルエット用）
    const core = blank();
    core.o.fillStyle = "#ffffff";
    core.o.fillText(emoji, c, c);

    // グロー込みのスプライト
    const full = blank();
    full.o.fillStyle = "#ffffff";
    if (glowPasses) {
      for (const g of glowPasses) {
        full.o.save();
        full.o.globalAlpha = g.alpha;
        full.o.shadowColor = g.color;
        full.o.shadowBlur = g.blur;
        full.o.fillText(emoji, c, c);
        full.o.restore();
      }
    }
    full.o.globalAlpha = 1;
    full.o.shadowBlur = 0;
    full.o.fillText(emoji, c, c);

    if (!outline) return { canvas: full.el, size };

    // シルエットを縁取りとして回りに敷く
    const sil = document.createElement("canvas");
    sil.width = px;
    sil.height = px;
    const sc = sil.getContext("2d");
    sc.drawImage(core.el, 0, 0);
    sc.globalCompositeOperation = "source-in";
    sc.fillStyle = outline.color;
    sc.fillRect(0, 0, px, px);

    const fin = document.createElement("canvas");
    fin.width = px;
    fin.height = px;
    const fc = fin.getContext("2d");
    const w = (outline.width || 2) * ss;
    const steps = 12;
    fc.globalAlpha = outline.alpha != null ? outline.alpha : 1;
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      fc.drawImage(sil, Math.cos(a) * w, Math.sin(a) * w);
    }
    fc.globalAlpha = 1;
    fc.drawImage(full.el, 0, 0);
    return { canvas: fin, size };
  }

  function buildSprites() {
    // 静的障害物
    SPRITES.tomb = makeSprite("🪦", CFG.tombEmojiSize,
      [{ color: "rgba(160, 110, 230, 0.5)", blur: 9, alpha: 0.85 }]);
    // 足場這い
    SPRITES.frank = makeSprite("🧟", CFG.frankEmojiSize,
      [{ color: "rgba(120, 220, 140, 0.35)", blur: 8, alpha: 0.7 }]);
    SPRITES.spider = makeSprite("🕷️", CFG.spiderEmojiSize,
      [{ color: "rgba(198, 142, 232, 0.55)", blur: 9, alpha: 0.75 }],
      { color: "rgba(176, 152, 224, 0.42)", width: 1.4, alpha: 1 });
    // 遊泳
    SPRITES.bat = makeSprite("🦇", CFG.batEmojiSize, null);
    SPRITES.blackCat = makeSprite("🐈‍⬛", CFG.blackCatEmojiSize,
      [{ color: "rgba(190, 150, 255, 0.24)", blur: 8, alpha: 0.45 }],
      { color: "rgba(198, 178, 250, 0.40)", width: 1.0, alpha: 0.30 });
    SPRITES.ghost = makeSprite("👻", CFG.ghostEmojiSize,
      [{ color: "rgba(205, 232, 255, 0.45)", blur: 14, alpha: 0.8 }]);
    // 巨大
    SPRITES.pumpkin = makeSprite("🎃", CFG.pumpkinEmojiSize, [
      { color: "rgba(255, 152, 0, 0.55)", blur: 26, alpha: 1 },
      { color: "rgba(255, 70, 0, 0.30)", blur: 44, alpha: 0.9 }
    ]);
    // プレイヤー
    SPRITES.witch = makeSprite("🧙‍♀️", CFG.playerEmojiSize,
      [{ color: "rgba(190, 110, 255, 0.85)", blur: 7, alpha: 0.6 }]);
    // お菓子
    SPRITES.itemStar = makeSprite("🍭", CFG.powerupEmojiSize,
      [{ color: "rgba(255, 110, 210, 0.8)", blur: 10, alpha: 0.9 }]);
    SPRITES.itemChoco = makeSprite("🍫", CFG.chocolateEmojiSize,
      [{ color: "rgba(195, 145, 95, 0.55)", blur: 8, alpha: 0.75 }]);
    SPRITES.itemFlame = makeSprite("🍬", CFG.wrappedEmojiSize,
      [{ color: "rgba(110, 225, 255, 0.75)", blur: 9, alpha: 0.85 }]);
    SPRITES.itemCrystal = makeSprite("🔮", CFG.crystalEmojiSize, [
      { color: "rgba(150, 110, 255, 0.85)", blur: 14, alpha: 0.95 },
      { color: "rgba(90, 200, 255, 0.45)", blur: 22, alpha: 0.6 }
    ], { color: "rgba(216, 238, 255, 0.9)", width: 1.8, alpha: 0.8 });
    // 弾
    SPRITES.star1 = makeSprite("🌟", CFG.star1EmojiSize,
      [{ color: "rgba(255, 225, 120, 0.9)", blur: 7, alpha: 0.8 }]);
    SPRITES.star2 = makeSprite("✨", CFG.star2EmojiSize,
      [{ color: "rgba(255, 255, 210, 0.9)", blur: 9, alpha: 0.8 }]);
    SPRITES.flame = makeSprite("🔥", CFG.flameEmojiSize,
      [{ color: "rgba(255, 150, 40, 0.85)", blur: 13, alpha: 0.9 }]);
    // タイトル用の大きな絵
    SPRITES.titlePumpkin = makeSprite("🎃", 168, [
      { color: "rgba(255, 152, 0, 0.5)", blur: 34, alpha: 1 },
      { color: "rgba(255, 70, 0, 0.26)", blur: 60, alpha: 0.9 }
    ]);
    SPRITES.titleWitch = makeSprite("🧙‍♀️", 104,
      [{ color: "rgba(190, 110, 255, 0.7)", blur: 18, alpha: 0.65 }]);
  }

  function ensureSprites() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const need = Math.min(4, Math.max(1, dpr * (rect.width / CFG.logicWidth)));
    if (need > spriteScale + 0.01) {
      spriteScale = Math.ceil(need * 2) / 2;
      buildSprites();
    }
  }

  function drawSprite(sp, x, y, facing, alpha, rot, scale) {
    if (!sp) return;
    const s = sp.size * (scale || 1);
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (facing > 0) ctx.scale(-1, 1);
    if (alpha != null && alpha !== 1) ctx.globalAlpha = alpha;
    ctx.drawImage(sp.canvas, -s / 2, -s / 2, s, s);
    ctx.restore();
  }

  // ===================== Helpers =====================
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function circleHit(ax, ay, ar, bx, by, br) {
    const dx = ax - bx, dy = ay - by, rr2 = ar + br;
    return dx * dx + dy * dy < rr2 * rr2;
  }
  function depthNow() {
    return Math.floor(maxScroll / CFG.scrollUnit);
  }
  function countActive(arr) {
    let n = 0;
    for (const e of arr) if (e.active) n++;
    return n;
  }

  // ===================== Resize =====================
  let lastCanvasWidth = 0;
  let lastCanvasHeight = 0;
  let lastCanvasDpr = 0;

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nextWidth = Math.max(1, Math.floor(rect.width * dpr));
    const nextHeight = Math.max(1, Math.floor(rect.height * dpr));

    if (nextWidth !== lastCanvasWidth || nextHeight !== lastCanvasHeight || dpr !== lastCanvasDpr) {
      canvas.width = nextWidth;
      canvas.height = nextHeight;
      lastCanvasWidth = nextWidth;
      lastCanvasHeight = nextHeight;
      lastCanvasDpr = dpr;
      bgGradient = null;
      dangerGradient = null;
      vignetteGrad = null;
      moonGrad = null;
      pumpkinGlowGrad = null;
    }

    const scaleX = rect.width / CFG.logicWidth;
    const scaleY = rect.height / CFG.logicHeight;
    ctx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ensureSprites();
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ===================== Focus =====================
  function setFocus(v) {
    focus = v;
    if (v) {
      canvas.focus();
      focusHint.classList.remove("show");
    } else {
      focusHint.classList.add("show");
      keys.clear();
      latched.p = false;
      latched.n = false;
      if (state === "playing") state = "paused";
    }
  }
  canvas.addEventListener("focus", () => setFocus(true));
  canvas.addEventListener("blur", () => setFocus(false));
  wrapper.addEventListener("click", () => setFocus(true));
  window.addEventListener("blur", () => setFocus(false));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setFocus(false);
  });

  // ===================== Input =====================
  function codeKey(code) {
    switch (code) {
      case "KeyB": return "b";
      case "KeyF": return "f";
      case "KeyP": return "p";
      case "KeyN": return "n";
      case "KeyR": return "r";
      case "Enter": return "enter";
      case "Space": return "space";
      case "Escape": return "esc";
      case "ArrowLeft": return "b";
      case "ArrowRight": return "f";
      case "ArrowUp": return "p";
      case "ArrowDown": return "n";
      case "Slash": return "?";
      case "Digit3": return "3";
      default: return null;
    }
  }

  window.addEventListener("keydown", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "b" || k === "f" || k === "enter" || k === "space" || k === "esc" || k === "r" ||
        k === "p" || k === "n" || k === "?" || k === "3") {
      e.preventDefault();
    }
    if (k === "p" || k === "n") {
      if (e.repeat) return;
      if (k === "p" && !latched.p) { latched.p = true; onPressEdge("p"); }
      if (k === "n" && !latched.n) { latched.n = true; onPressEdge("n"); }
      return;
    }
    keys.add(k);
    if (k === "enter") {
      if (state === "title" || state === "gameover") startGame();
    }
    if (k === "r") {
      if (state === "gameover") startGame();
    }
    if (k === "space") {
      if (state === "paused") state = "playing";
    }
    if (k === "esc") {
      if (state === "playing") state = "paused";
      else if (state === "paused") toTitle();
      else if (state === "gameover") toTitle();
    }
    if (k === "?") { helpVisible = !helpVisible; }
    if (k === "3" && e.shiftKey && state === "title") {
      bestDepth = 0; saveBest();
    }
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "p") latched.p = false;
    if (k === "n") latched.n = false;
    keys.delete(k);
  });

  const WIDTH_SCALE = CFG.logicWidth / 800;
  function scaled(v) { return v * WIDTH_SCALE; }

  function onPressEdge(action) {
    if (state !== "playing" || !player) return;
    if (action === "p") {
      if (player.grounded) {
        player.vy = scaled(CFG.hopVel);
        player.grounded = false;
        spawnHopParticles(player.x, player.y + player.hh);
      }
    } else if (action === "n") {
      if (player.grounded) {
        player.diveIgnore = CFG.diveIgnoreTime;
        player.vy = scaled(CFG.diveVel);
        player.grounded = false;
        player.airDiveUsed = false;
      } else if (!player.airDiveUsed) {
        player.vy = scaled(CFG.diveVel);
        player.airDiveUsed = true;
      }
    }
  }

  // ===================== Entities =====================
  function makePlayer() {
    return {
      x: CFG.logicWidth / 2, y: 0, vx: 0, vy: 0,
      hw: CFG.playerW / 2, hh: CFG.playerH / 2,
      grounded: false, diveIgnore: 0, airDiveUsed: false,
      facing: 1, invuln: true,
      starTimer: 0, starAcc: 0, nextStarBig: false,
      flameTimer: 0, flameAcc: 0,
      shield: false,
    };
  }

  function makePlatform(y, x, w) {
    return { x, y, w, h: 18, seed: Math.random() * 1000 };
  }
  function makeTomb(x, y) { return { x, y, r: CFG.tombRadius, active: true }; }
  function makeItem(x, y, type) {
    const r = type === "star" ? CFG.powerupRadius
      : (type === "choco" ? CFG.chocolateRadius
        : (type === "crystal" ? CFG.crystalRadius : CFG.wrappedRadius));
    return { x, y, r, type, active: true, bob: Math.random() * Math.PI * 2 };
  }
  function makeStar(x, y, ang, big) {
    const spd = CFG.starSpeed * (0.75 + Math.random() * 0.5);
    return {
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      r: CFG.starRadius, big: !!big,
      spin: (Math.random() - 0.5) * 6, rot: Math.random() * Math.PI * 2,
      active: true,
    };
  }
  function makeFlame(x, y, ang) {
    const spd = CFG.flameSpeed * (0.82 + Math.random() * 0.36);
    return {
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      r: CFG.flameRadius, life: CFG.flameLife, maxLife: CFG.flameLife,
      rot: ang + Math.PI / 2 + (Math.random() - 0.5) * 0.5,
