<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深海潜行 - Abyss Hop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020d1f;
    color: #e0f7ff;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-wrapper {
    position: relative;
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    aspect-ratio: 4 / 3;
    box-sizing: border-box;
    background: #000;
    box-shadow: 0 0 40px rgba(0, 150, 255, 0.25);
    border: 2px solid #0b2e4f;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  #focus-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 10, 30, 0.85);
    border: 1px solid #1b6f9c;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    color: #8fd7ff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }
  #focus-hint.show {
    opacity: 1;
  }
  #manual-link {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 6;
    padding: 6px 12px;
    border: 1px solid #1b6f9c;
    border-radius: 999px;
    background: rgba(0, 10, 30, 0.72);
    color: #8fd7ff;
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 0.06em;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s;
  }
  #manual-link.show {
    opacity: 1;
    visibility: visible;
  }
  #manual-link:hover {
    background: rgba(0, 20, 45, 0.9);
    color: #c2f0ff;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas" tabindex="0"></canvas>
  <div id="focus-hint">ゲーム画面をクリックして操作</div>
<a id="manual-link" href="manual.html" target="_blank" rel="noopener">📖 遊び方・説明書</a>
</div>
<script>
(() => {
  "use strict";

  // ===== Configuration =====
  const CFG = {
    logicWidth: 800,
    logicHeight: 600,
    gravity: 1800,
    hopVel: -650,
    diveVel: 520,
    moveAccel: 800,
    maxRunSpeed: 220,
    friction: 0.82,
    airDrag: 0.96,
    scrollBase: 90,
    scrollMax: 280,
    scrollRamp: 0.003,
    cameraMarginTop: 120,
    cameraMarginBottom: 60,
    shellRadius: 14,
    shellEmojiSize: 30,
    sharkRadius: 14,
    sharkEmojiSize: 30,
    crabRadius: 14,
    crabEmojiSize: 30,
    whaleRadius: 52,
    whaleEmojiSize: 108,
    playerW: 34,
    playerH: 26,
    playerHitShrink: 3,
    playerEmojiSize: 30,
    introDuration: 0.28,
    safeStartTime: 3.2,
    diveIgnoreTime: 0.18,
    maxDt: 0.033,
    accumulatorMax: 0.1,
    bubbleCount: 26,
    dangerBubbleCount: 12,
    scrollUnit: 120,
    enemySafeDist: 145,
    startBannerTime: 0.85,
    startInvulnTime: 0.65,
    gameOverFallGravity: 1700,
    gameOverFallSpin: 5.2,
    firstEnemyTime: 2.0,
    firstCrabTime: 2.4,
    firstSharkTime: 2.8,
    firstWhaleTime: 24,
    maxShells: 256,
    maxCrabs: 256,
    maxSharks: 256,
    maxWhales: 256,
    maxPuffers: 256,
    // 🐡: 表示深度100スクロール超で登場。🐟の1.25〜2.0倍を行き来して膨らむ/しぼむ。
    pufferEmojiSize: 60,            // スプライトは最大サイズ(2.0x=60)で焼き、描画時に縮小
    pufferBaseScale: 0.625,        // 60 * 0.625 = 37.5 = 🐟の1.25倍(最小)
    pufferMaxScale: 1.0,           // 60 * 1.0 = 60 = 🐟の2.0倍(最大)
    pufferRadiusMin: 17,           // 当たり半径（しぼみ時）
    pufferRadiusMax: 28,           // 当たり半径（膨らみ時・クジラ52より十分小さく）
    pufferSpeed: 105,              // 🦈(最大140)より若干遅い巡航速度
    pufferBreath: 0.9,             // 膨張/収縮の速さ(rad/s)
    firstPufferDepth: 100,         // 表示深度この値を超えてから出現
    // ===== サウンド系パワーアップ =====
    // 🎧: 表示深度100スクロールごとに床へ1個。🐟と同じくらいの大きさ。
    powerupEmojiSize: 30,
    powerupRadius: 15,
    itemPickupParticles: 14,
    powerupDepthStep: 100,          // 何スクロールごとに出すか（HUD表示と同じ単位）
    // 効果: 取得から12秒間、🐟の周囲に音符を全方位放出。
    musicDuration: 12,
    noteEmitInterval: 0.09,         // 音符の放出間隔（秒）
    noteEmitPerTick: 2,             // 1回に出す数
    noteSpeed: 150,                 // 放出初速(px/s)
    noteRange: 105,                 // 🐟からこの距離を超えた音符は消える（近距離オーラ）
    noteRadius: 12,                 // 音符の当たり半径
    note1EmojiSize: 22,             // 🎵
    note2EmojiSize: 37,             // 🎶（約1.7倍）
    maxNotes: 64,                   // 同時存在上限（負荷対策）
    whaleHp: 3,                     // クジラは音符3ヒットで消滅
  };

  // ===== State =====
  const canvas = document.getElementById("gameCanvas");
  const wrapper = document.getElementById("game-wrapper");
  const focusHint = document.getElementById("focus-hint");
  const manualLink = document.getElementById("manual-link");
  const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

  let state = "title";
  let lastTime = 0;
  let acc = 0;
  let focus = false;
  let bestDepth = 0;
  let shake = 0;
  let dim = 0;
  let topDanger = 0;
  let deathFish = null;
  let helpVisible = true;
  let helpTimer = 0;

  const keys = new Set();
  const latched = { p: false, n: false };

  let worldScroll = 0;
  let maxScroll = 0;
  let scrollSpeed = CFG.scrollBase;
  let introTimer = 0;
  let playTime = 0;
  let startBannerTimer = 0;
  let invulnTimer = 0;

  let player = null;
  let platforms = [];
  let shells = [];
  let powerups = [];
  let notes = [];
  let sharks = [];
  let whales = [];
  let puffers = [];
  let crabs = [];
  let bubbles = [];
  let dangerBubbles = [];
  let particles = [];

  let cameraY = 0;
  let generatedUntil = 0;
  let startPlatform = null;
  let nextPowerupDepth = CFG.powerupDepthStep;  // 次に🎧を出す表示深度

  // ===== localStorage =====
  function loadBest() {
    try {
      const v = localStorage.getItem("abyss_best_depth");
      if (v) bestDepth = Math.max(0, parseInt(v, 10) || 0);
    } catch (e) { bestDepth = 0; }
  }
  function saveBest() {
    try {
      localStorage.setItem("abyss_best_depth", String(bestDepth));
    } catch (e) {}
  }
  loadBest();

  // タイトル画面にも泡を出し、初回ゲーム開始時の初期化集中を少し減らす。
  resetBubbles();
  resetDangerBubbles();

  // ===== Sprite cache =====
  // 絵文字を毎フレーム fillText + shadowBlur で描くと、敵が増え続けたとき
  // グリフのラスタライズと発光処理がボトルネックになる。
  // そこで各絵文字（発光込み）を一度だけオフスクリーンに焼き、以降は
  // drawImage で使い回す。左右反転は描画時の scale だけで済ませる。
  const SPRITES = {};
  let spriteScale = 0;
  let bgGradient = null;
  let dangerGradient = null;

  function makeSprite(emoji, fontSize, glowPasses) {
    const ss = spriteScale;
    let maxBlur = 0;
    if (glowPasses) for (const g of glowPasses) maxBlur = Math.max(maxBlur, g.blur);
    const pad = maxBlur + 8;
    const size = fontSize + pad * 2;
    const oc = document.createElement("canvas");
    oc.width = Math.max(1, Math.round(size * ss));
    oc.height = Math.max(1, Math.round(size * ss));
    const o = oc.getContext("2d");
    o.setTransform(ss, 0, 0, ss, 0, 0);
    o.textAlign = "center";
    o.textBaseline = "middle";
    o.font = fontSize + "px sans-serif";
    o.fillStyle = "#ffffff";
    const c = size / 2;
    if (glowPasses) {
      for (const g of glowPasses) {
        o.save();
        o.globalAlpha = g.alpha;
        o.shadowColor = g.color;
        o.shadowBlur = g.blur;
        o.fillText(emoji, c, c);
        o.restore();
      }
    }
    o.globalAlpha = 1;
    o.shadowBlur = 0;
    o.fillText(emoji, c, c);
    return { canvas: oc, size };
  }

  function buildSprites() {
    SPRITES.shell = makeSprite("🐚", CFG.shellEmojiSize, null);
    SPRITES.crab  = makeSprite("🦀", CFG.crabEmojiSize, null);
    SPRITES.shark = makeSprite("🦈", CFG.sharkEmojiSize, null);
    SPRITES.whale = makeSprite("🐋", CFG.whaleEmojiSize, [{ color: "rgba(70,180,255,0.32)", blur: 18, alpha: 1 }]);
    SPRITES.puffer = makeSprite("🐡", CFG.pufferEmojiSize, [{ color: "rgba(255,210,80,0.24)", blur: 10, alpha: 0.7 }]);
    // プレイヤー魚は「薄い発光 → 本体」の2パスを焼き込み、輪郭をはっきり保つ。
    SPRITES.fish  = makeSprite("🐟", CFG.playerEmojiSize, [{ color: "rgba(80,200,255,0.75)", blur: 6, alpha: 0.55 }]);
    // 🎧 は🐟と同じくらいの大きさ。取りに行きたくなるよう軽く光らせる。
    SPRITES.phones = makeSprite("🎧", CFG.powerupEmojiSize, [{ color: "rgba(120,230,255,0.8)", blur: 9, alpha: 0.7 }]);
    // 音符2種。🎶 は🎵の約1.7倍。発光を焼き込んで小さくても視認できるように。
    SPRITES.note1 = makeSprite("🎵", CFG.note1EmojiSize, [{ color: "rgba(160,240,255,0.85)", blur: 6, alpha: 0.7 }]);
    SPRITES.note2 = makeSprite("🎶", CFG.note2EmojiSize, [{ color: "rgba(190,200,255,0.85)", blur: 7, alpha: 0.7 }]);
  }

  function ensureSprites() {
    // 表示スケール（dpr × 拡大率）に見合う解像度で焼き直し、拡大時のボケを防ぐ。
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const need = Math.min(4, Math.max(1, dpr * (rect.width / CFG.logicWidth)));
    if (need > spriteScale + 0.01) {
      spriteScale = Math.ceil(need * 2) / 2; // 0.5刻みで確保し、頻繁な再生成を避ける
      buildSprites();
    }
  }

  function drawSprite(sp, x, y, facing, alpha, rot, scale) {
    const s = sp.size * (scale || 1);
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    // 絵文字は多くの環境で左向きなので、右移動時だけ反転する。
    if (facing > 0) ctx.scale(-1, 1);
    if (alpha != null && alpha !== 1) ctx.globalAlpha = alpha;
    ctx.drawImage(sp.canvas, -s / 2, -s / 2, s, s);
    ctx.restore();
  }

  // ===== Resize =====
  let lastCanvasWidth = 0;
  let lastCanvasHeight = 0;
  let lastCanvasDpr = 0;

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nextWidth = Math.max(1, Math.floor(rect.width * dpr));
    const nextHeight = Math.max(1, Math.floor(rect.height * dpr));

    // Canvasのwidth/height再設定は内部バッファ再確保を伴うため、必要な時だけ行う。
    if (nextWidth !== lastCanvasWidth || nextHeight !== lastCanvasHeight || dpr !== lastCanvasDpr) {
      canvas.width = nextWidth;
      canvas.height = nextHeight;
      lastCanvasWidth = nextWidth;
      lastCanvasHeight = nextHeight;
      lastCanvasDpr = dpr;
      bgGradient = null;
      dangerGradient = null;
    }

    // Canvasの実表示サイズとゲーム内論理解像度を分離してスケーリングする。
    const scaleX = rect.width / CFG.logicWidth;
    const scaleY = rect.height / CFG.logicHeight;
    ctx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ensureSprites();
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ===== Focus =====
  function setFocus(v) {
    focus = v;
    if (v) {
      canvas.focus();
      focusHint.classList.remove("show");
    } else {
      focusHint.classList.add("show");
      keys.clear();
      latched.p = false;
      latched.n = false;
      if (state === "playing") state = "paused";
    }
  }
  canvas.addEventListener("focus", () => setFocus(true));
  canvas.addEventListener("blur", () => setFocus(false));
  wrapper.addEventListener("click", () => {
    // クリックはフォーカス取得だけ。開始・再開はキー操作で統一する。
    setFocus(true);
  });
  window.addEventListener("blur", () => setFocus(false));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setFocus(false);
  });

  // ===== Input =====
  function codeKey(code) {
    switch (code) {
      case "KeyB": return "b";
      case "KeyF": return "f";
      case "KeyP": return "p";
      case "KeyN": return "n";
      case "KeyR": return "r";
      case "Enter": return "enter";
      case "Space": return "space";
      case "Escape": return "esc";
      case "ArrowLeft":  return "b";
      case "ArrowRight": return "f";
      case "ArrowUp":    return "p";
      case "ArrowDown":  return "n";
      case "Slash":      return "?";
      case "Digit3":     return "3";
      default: return null;
    }
  }

  window.addEventListener("keydown", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "b" || k === "f" || k === "enter" || k === "space" || k === "esc" || k === "r" ||
        k === "p" || k === "n" || k === "?" || k === "3") {
      e.preventDefault();
    }
    if (k === "p" || k === "n") {
      if (e.repeat) return;
      if (k === "p" && !latched.p) { latched.p = true; onPressEdge("p"); }
      if (k === "n" && !latched.n) { latched.n = true; onPressEdge("n"); }
      return;
    }
    keys.add(k);
    if (k === "enter") {
      if (state === "title" || state === "gameover") startGame();
    }
    if (k === "r") {
      if (state === "gameover") startGame();
    }
    if (k === "space") {
      if (state === "paused") state = "playing";
    }
    if (k === "esc") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "title";
      else if (state === "gameover") state = "title";
    }
    if (k === "?") {
      helpVisible = !helpVisible;
    }
    if (k === "3" && e.shiftKey && state === "title") {
      bestDepth = 0;
      saveBest();
    }
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "p") { latched.p = false; }
    if (k === "n") { latched.n = false; }
    keys.delete(k);
  });

  // 800px幅を基準にした物理スケール。論理解像度は実行中に変わらないため一度だけ算出する。
  const WIDTH_SCALE = CFG.logicWidth / 800;
  function scaled(v) {
    return v * WIDTH_SCALE;
  }

  function onPressEdge(action) {
    if (state !== "playing") return;
    if (!player) return;
    if (action === "p") {
      if (player.grounded) {
        player.vy = scaled(CFG.hopVel);
        player.grounded = false;
        spawnHopParticles(player.x, player.y + player.hh);
      }
    } else if (action === "n") {
      if (player.grounded) {
        player.diveIgnore = CFG.diveIgnoreTime;
        player.vy = scaled(CFG.diveVel);
        player.grounded = false;
        player.airDiveUsed = false;
      } else if (!player.airDiveUsed) {
        player.vy = scaled(CFG.diveVel);
        player.airDiveUsed = true;
      }
    }
  }

  // ===== Entities =====
  function makePlayer() {
    return {
      x: CFG.logicWidth / 2,
      y: 0,
      vx: 0,
      vy: 0,
      hw: CFG.playerW / 2,
      hh: CFG.playerH / 2,
      grounded: false,
      diveIgnore: 0,
      airDiveUsed: false,
      facing: 1,
      invuln: true,
      musicTimer: 0,      // >0 の間、音符オーラ発生
      noteAcc: 0,         // 音符放出用のタイマー蓄積
      nextNoteBig: false, // 🎵 / 🎶 を交互に出す
    };
  }

  function makePlatform(y, x, w) {
    return { x, y, w, h: 18, flowOffset: Math.random() * 1000 };
  }

  function makeShell(x, y) {
    return { x, y, r: CFG.shellRadius, active: true };
  }

  function makePowerup(x, y) {
    return { x, y, r: CFG.powerupRadius, active: true, bob: Math.random() * Math.PI * 2 };
  }

  function makeNote(x, y, ang, big) {
    const spd = CFG.noteSpeed * (0.75 + Math.random() * 0.5);
    return {
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: CFG.noteRadius,
      big: !!big,               // true=🎶(大) / false=🎵(小)
      spin: (Math.random() - 0.5) * 6,
      rot: Math.random() * Math.PI * 2,
      active: true,
    };
  }

  function makeShark(x, y) {
    return {
      x, y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 60),
      vy: (Math.random() - 0.5) * 40,
      r: CFG.sharkRadius,
      turnTimer: 1 + Math.random() * 2,
      facing: 1,
      active: true,
    };
  }

  function makePuffer(x, y) {
    const ang = Math.random() * Math.PI * 2;
    const spd = CFG.pufferSpeed * (0.8 + Math.random() * 0.4);
    return {
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      breath: Math.random() * Math.PI * 2,  // 膨張位相
      scale: CFG.pufferBaseScale,
      r: CFG.pufferRadiusMin,
      facing: Math.cos(ang) >= 0 ? 1 : -1,
      active: true,
    };
  }

  function makeWhale(x, y) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    return {
      x, y,
      vx: dir * (24 + Math.random() * 24),
      vy: (Math.random() - 0.5) * 16,
      r: CFG.whaleRadius,
      turnTimer: 2.5 + Math.random() * 2.5,
      facing: dir,
      bob: Math.random() * Math.PI * 2,
      active: true,
      hp: CFG.whaleHp,
    };
  }

  function makeCrab(x, y, left, right) {
    return {
      x, y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 30),
      r: CFG.crabRadius,
      left, right,
      active: true,
    };
  }

  function makeBubble() {
    return {
      x: Math.random() * CFG.logicWidth,
      y: Math.random() * CFG.logicHeight,
      r: 1 + Math.random() * 2.5,
      speed: 20 + Math.random() * 40,
      wobble: Math.random() * Math.PI * 2,
    };
  }

  function resetBubbles() {
    for (let i = 0; i < CFG.bubbleCount; i++) {
      const b = bubbles[i] || (bubbles[i] = makeBubble());
      b.x = Math.random() * CFG.logicWidth;
      b.y = Math.random() * CFG.logicHeight;
      b.r = 1 + Math.random() * 2.5;
      b.speed = 20 + Math.random() * 40;
      b.wobble = Math.random() * Math.PI * 2;
    }
    bubbles.length = CFG.bubbleCount;
  }

  function makeDangerBubble() {
    return {
      x: Math.random() * CFG.logicWidth,
      y: -8 - Math.random() * 46,
      r: 2 + Math.random() * 4,
      speed: 18 + Math.random() * 46,
      wobble: Math.random() * Math.PI * 2,
    };
  }

  function resetDangerBubbles() {
    for (let i = 0; i < CFG.dangerBubbleCount; i++) {
      const b = dangerBubbles[i] || (dangerBubbles[i] = makeDangerBubble());
      b.x = Math.random() * CFG.logicWidth;
      b.y = -10 - Math.random() * 64;
      b.r = 2 + Math.random() * 4;
      b.speed = 18 + Math.random() * 46;
      b.wobble = Math.random() * Math.PI * 2;
    }
    dangerBubbles.length = CFG.dangerBubbleCount;
  }

  function spawnHopParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 120,
        vy: Math.random() * 60,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 1,
        r: 1.5 + Math.random() * 2,
        color: "rgba(160,230,255,0.9)",
      });
    }
  }

  function spawnPickupParticles(x, y) {
    for (let i = 0; i < CFG.itemPickupParticles; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 1,
        r: 1.5 + Math.random() * 2.5,
        color: "rgba(150,240,255,0.95)",
      });
    }
  }

  // 敵が音符で消えたときの小さな破裂。
  function spawnPopParticles(x, y) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 70 + Math.random() * 130;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.4,
        maxLife: 1,
        r: 1.5 + Math.random() * 2.5,
        color: "rgba(190,220,255,0.9)",
      });
    }
  }

  function spawnSplash(x, y) {
    for (let i = 0; i < 20; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 200,
        vy: -Math.random() * 180,
        life: 0.8 + Math.random() * 0.5,
        maxLife: 1,
        r: 2 + Math.random() * 3,
        color: "rgba(200,245,255,0.95)",
      });
    }
  }

  function spawnDeathBubbles(x, y) {
    for (let i = 0; i < 30; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 100,
        vy: -20 - Math.random() * 120,
        life: 1.2 + Math.random() * 1.0,
        maxLife: 1,
        r: 2 + Math.random() * 4,
        color: "rgba(180,230,255,0.85)",
      });
    }
  }

  // ===== Generation =====
  function resetWorld() {
    player = makePlayer();
    platforms.length = 0;
    shells.length = 0;
    powerups.length = 0;
    notes.length = 0;
    crabs.length = 0;
    sharks.length = 0;
    whales.length = 0;
    puffers.length = 0;
    particles.length = 0;
    resetBubbles();
    resetDangerBubbles();
    worldScroll = 0;
    maxScroll = 0;
    scrollSpeed = CFG.scrollBase;
    playTime = 0;
    startBannerTimer = 0;
    invulnTimer = 0;
    shake = 0;
    dim = 0;
    topDanger = 0;
    deathFish = null;
    nextPowerupDepth = CFG.powerupDepthStep;

    // First platform: long and safe, place player directly on it
    startPlatform = makePlatform(120, 0, 340);
    platforms.push(startPlatform);
    platforms.push(makePlatform(245, CFG.logicWidth * 0.38, 250));
    platforms.push(makePlatform(370, CFG.logicWidth - 310, 310));
    platforms.push(makePlatform(495, 0, 260));

    // 最初の敵は生成待ちにせず、少し先の海流面に置いて早めに見せる。
    // 開幕足場と直近の着地点は空けるので、初手は安全に操作できる。
    shells.push(makeShell(CFG.logicWidth - 84, 360));
    crabs.push(makeCrab(CFG.logicWidth - 170, 360, CFG.logicWidth - 300, CFG.logicWidth - 18));
    sharks.push(makeShark(CFG.logicWidth * 0.70, 505));

    // Player starts exactly on the first platform
    player.x = startPlatform.x + startPlatform.w / 2;
    player.y = startPlatform.y - player.hh;
    player.vy = 0;
    player.vx = 0;
    player.grounded = true;
    player.diveIgnore = 0;
    player.airDiveUsed = false;

    // Camera positioned so surface is visible above and player is comfortably in view
    cameraY = player.y - CFG.logicHeight * 0.45;

    generatedUntil = 610;
    introTimer = CFG.introDuration;
    helpTimer = 20;
  }

  function difficultyProfile() {
    // 単純な線形ではなく、深度に応じたベース難度 + ゆるい波 + ランダムな小変化。
    const depthScroll = maxScroll / CFG.scrollUnit;
    const t = Math.min(1, playTime / 150);
    const smooth = t * t * (3 - 2 * t);
    const wave = 0.08 * Math.sin(playTime * 0.23) + 0.05 * Math.sin(depthScroll * 0.71);
    return Math.max(0, Math.min(1, smooth + wave));
  }

  function platformOverlaps(pl, arr) {
    return arr.some(o => Math.abs(o.y - pl.y) < 22 && pl.x < o.x + o.w + 18 && pl.x + pl.w + 18 > o.x);
  }

  function addPlatformIfClear(arr, pl) {
    if (!platformOverlaps(pl, arr)) arr.push(pl);
  }

  function generateUntil(targetY) {
    while (generatedUntil < targetY) {
      const difficulty = difficultyProfile();
      const depthScroll = maxScroll / CFG.scrollUnit;
      const early = playTime < CFG.safeStartTime;
      const spacingMin = early ? 82 : 72 - difficulty * 18;
      const spacingMax = early ? 118 : 132 - difficulty * 24;
      const spacing = spacingMin + Math.random() * (spacingMax - spacingMin);
      const y = generatedUntil + spacing;

      // その区間で必ず到達できる安全足場を1つ作る。
      const safeW = early ? 230 + Math.random() * 90 : 165 + Math.random() * (90 - difficulty * 30);
      const safeBias = 0.5 + Math.sin(depthScroll * 0.9) * 0.22;
      let safeX = safeBias * (CFG.logicWidth - safeW) + (Math.random() - 0.5) * 120;
      safeX = Math.max(0, Math.min(CFG.logicWidth - safeW, safeX));

      // ときどき画面端にくっつく海流面を出す。初期も安心できるよう片側接続を混ぜる。
      const edgeChance = early ? 0.28 : 0.22 + difficulty * 0.13;
      if (Math.random() < edgeChance) {
        const edgeLeft = Math.random() < 0.5;
        safeX = edgeLeft ? 0 : CFG.logicWidth - safeW;
      }

      const segPlatforms = [];
      segPlatforms.push(makePlatform(y, safeX, safeW));

      // 追加足場。深度帯で雰囲気を変える。
      const band = Math.floor(depthScroll / 8) % 4; // 0:穏やか 1:広め 2:端寄せ 3:散らし
      let extraCount = early ? 1 : 1 + Math.floor(Math.random() * (2 + difficulty * 2));
      if (band === 1 && !early) extraCount += 1;
      if (band === 3 && Math.random() < 0.45) extraCount += 1;

      for (let i = 0; i < extraCount; i++) {
        let pw = early ? 180 + Math.random() * 120 : 90 + Math.random() * (160 - difficulty * 35);
        let px;
        if (band === 2 && Math.random() < 0.55) {
          px = Math.random() < 0.5 ? 0 : CFG.logicWidth - pw;
        } else {
          px = Math.random() * (CFG.logicWidth - pw);
        }
        addPlatformIfClear(segPlatforms, makePlatform(y + (Math.random() - 0.5) * 20, px, pw));
      }

      platforms.push(...segPlatforms);

      // 障害物：2秒後すぎから出す。安全足場は塞ぎ切らない。
      segPlatforms.forEach((pl, idx) => {
        if (playTime < CFG.firstEnemyTime) return;
        if (idx === 0 && Math.random() < 0.80) return;
        const shellChance = 0.22 + difficulty * 0.24 + (band === 1 ? 0.06 : 0);
        if (Math.random() < shellChance && pl.w > 80 && shells.length < CFG.maxShells) {
          const sx = pl.x + 28 + Math.random() * Math.max(1, pl.w - 56);
          const sy = pl.y - 10;
          shells.push(makeShell(sx, sy));
        }
      });

      // カニ：2秒台から登場。安全足場には出しにくくする。
      segPlatforms.forEach((pl, idx) => {
        if (playTime < CFG.firstCrabTime) return;
        if (idx === 0 && Math.random() < 0.66) return;
        if (pl.w > 110 && crabs.length < CFG.maxCrabs && Math.random() < 0.18 + difficulty * 0.20) {
          const cx = pl.x + 18 + Math.random() * Math.max(1, pl.w - 36);
          const cy = pl.y - 10;
          crabs.push(makeCrab(cx, cy, pl.x + 10, pl.x + pl.w - 10));
        }
      });

      // サメ：スクロールが遅いので2秒台後半から登場。ただし序盤は低密度。
      if (playTime > CFG.firstSharkTime && sharks.length < CFG.maxSharks) {
        const sharkChance = 0.12 + difficulty * 0.24 + (band === 3 ? 0.08 : 0);
        if (Math.random() < sharkChance) {
          const sx = 40 + Math.random() * (CFG.logicWidth - 80);
          const sy = y - 30 - Math.random() * 85;
          if (!player || Math.hypot(sx - player.x, sy - player.y) > CFG.enemySafeDist) {
            sharks.push(makeShark(sx, sy));
          }
        }
      }

      // クジラ：中盤から出る巨大な移動障害。遅くて予測しやすいが、画面支配力が高い。
      if (playTime > CFG.firstWhaleTime && whales.length < CFG.maxWhales) {
        const whaleChance = 0.035 + difficulty * 0.09 + (band === 2 ? 0.025 : 0);
        if (Math.random() < whaleChance) {
          const wx = 90 + Math.random() * (CFG.logicWidth - 180);
          const wy = y - 55 - Math.random() * 110;
          if (!player || Math.hypot(wx - player.x, wy - player.y) > CFG.enemySafeDist + CFG.whaleRadius) {
            whales.push(makeWhale(wx, wy));
          }
        }
      }

      // 🐡: 表示深度100スクロール超で登場。膨らんだり縮んだりしながら漂う中型の脅威。
      if (depthScroll > CFG.firstPufferDepth && puffers.length < CFG.maxPuffers) {
        const pufferChance = 0.05 + difficulty * 0.10 + (band === 3 ? 0.04 : 0);
        if (Math.random() < pufferChance) {
          const fx = 60 + Math.random() * (CFG.logicWidth - 120);
          const fy = y - 40 - Math.random() * 90;
          if (!player || Math.hypot(fx - player.x, fy - player.y) > CFG.enemySafeDist + CFG.pufferRadiusMax) {
            puffers.push(makePuffer(fx, fy));
          }
        }
      }

      generatedUntil = y;
    }
  }

  // 🎧: 表示深度が powerupDepthStep ごとの節目を超えたら、これから潜る足場に1個置く。
  // 生成済みの範囲から「プレイヤーより下（これから行く側）」の広めの足場を選ぶ。
  function spawnPowerupIfDue() {
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    if (depth < nextPowerupDepth) return;

    let target = null;
    for (const pl of platforms) {
      if (pl.y <= player.y + 40) continue;              // 上（通り過ぎた側）は除外
      if (pl.w < 90) continue;                          // 狭すぎる足場は避ける
      if (!target || pl.y < target.y) target = pl;      // なるべく手前（浅い）を優先
    }
    // 適地が無ければ節目だけ消化して次の節目へ（無限ループ防止）。
    if (target && powerups.length < 64) {
      powerups.push(makePowerup(target.x + target.w / 2, target.y - 24));
    }
    nextPowerupDepth += CFG.powerupDepthStep;
  }

  function compactEntities(arr, minY, maxY, activeOnly) {
    let write = 0;
    for (let read = 0; read < arr.length; read++) {
      const entity = arr[read];
      if (activeOnly && !entity.active) continue;
      if (entity.y <= minY || entity.y >= maxY) continue;
      arr[write++] = entity;
    }
    arr.length = write;
  }

  function cleanup(yTop) {
    const minY = yTop - 200;
    compactEntities(platforms, minY, Infinity, false);
    compactEntities(shells, minY, Infinity, true);
    compactEntities(powerups, minY, Infinity, true);
    compactEntities(notes, minY - 200, yTop + CFG.logicHeight + 200, true);
    compactEntities(crabs, minY, Infinity, true);
    // サメとクジラはカメラ内に留まり続ける仕様。active=false なら将来のアイテム効果で削除できる。
    compactEntities(sharks, minY, Infinity, true);
    compactEntities(whales, minY, yTop + CFG.logicHeight + 260, true);
    // 🐡 は画面内で跳ね返る仕様。inactive（音符で撃破）だけ除去する。
    compactEntities(puffers, minY, yTop + CFG.logicHeight + 260, true);
  }

  function playerHitRadius() {
    // 見た目の魚30pxに対して、中心から約14pxを衝突半径にする。
    // 「触れて見えるのに当たらない」を減らしつつ、発光や余白までは拾わない。
    return Math.max(8, CFG.playerW / 2 - CFG.playerHitShrink);
  }

  // ===== Physics =====
  function updatePhysics(dt) {
    if (!player) return;
    const p = player;

    p.vy += scaled(CFG.gravity) * dt;

    const left = keys.has("b");
    const right = keys.has("f");
    if (p.grounded) {
      if (left && !right) {
        p.vx -= scaled(CFG.moveAccel) * dt;
        p.facing = -1;
      } else if (right && !left) {
        p.vx += scaled(CFG.moveAccel) * dt;
        p.facing = 1;
      } else {
        p.vx *= CFG.friction;
      }
      if (p.vx > scaled(CFG.maxRunSpeed)) p.vx = scaled(CFG.maxRunSpeed);
      if (p.vx < -scaled(CFG.maxRunSpeed)) p.vx = -scaled(CFG.maxRunSpeed);
    } else {
      p.vx *= CFG.airDrag;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.diveIgnore > 0) p.diveIgnore -= dt;

    if (p.x < p.hw) { p.x = p.hw; p.vx = 0; }
    if (p.x > CFG.logicWidth - p.hw) { p.x = CFG.logicWidth - p.hw; p.vx = 0; }

    p.grounded = false;
    if (p.vy >= 0) {
      const prevY = p.y - p.vy * dt;
      for (const pl of platforms) {
        if (p.diveIgnore > 0) continue;
        const platTop = pl.y;
        const wasAbove = (prevY + p.hh) <= platTop + 1;
        const nowOnOrBelow = (p.y + p.hh) >= platTop;
        const withinX = p.x + p.hw - CFG.playerHitShrink > pl.x && p.x - p.hw + CFG.playerHitShrink < pl.x + pl.w;
        if (wasAbove && nowOnOrBelow && withinX) {
          p.y = platTop - p.hh;
          p.vy = 0;
          p.grounded = true;
          p.airDiveUsed = false;
          break;
        }
      }
    }

    // 🎧 の取得。ダメージではないので無敵中でも拾える。
    if (state === "playing") {
      const grabR = playerHitRadius();
      for (const pu of powerups) {
        if (!pu.active) continue;
        const dx = p.x - pu.x, dy = p.y - pu.y, rr = grabR + pu.r;
        if (dx * dx + dy * dy < rr * rr) {
          pu.active = false;
          p.musicTimer = CFG.musicDuration;   // 再取得なら残り時間を12秒へリセット
          p.noteAcc = 0;
          spawnPickupParticles(pu.x, pu.y);
        }
      }
    }

    if (state === "playing" && introTimer <= 0 && !p.invuln) {
      // 敵は増え続ける設計なので、共通の自機半径はループ外で一度だけ求める。
      const pr = playerHitRadius();
      for (const s of shells) {
        if (!s.active) continue;
        const dx = p.x - s.x, dy = p.y - s.y, rr = pr + s.r;
        if (dx * dx + dy * dy < rr * rr) { gameOver(); return; }
      }
      for (const sh of sharks) {
        if (!sh.active) continue;
        const dx = p.x - sh.x, dy = p.y - sh.y, rr = pr + sh.r;
        if (dx * dx + dy * dy < rr * rr) { gameOver(); return; }
      }
      for (const wh of whales) {
        if (!wh.active) continue;
        // 見た目は巨大だが、当たり判定はやや小さくして理不尽さを抑える。
        const dx = p.x - wh.x, dy = p.y - wh.y, rr = pr + wh.r;
        if (dx * dx + dy * dy < rr * rr) { gameOver(); return; }
      }
      for (const c of crabs) {
        if (!c.active) continue;
        const dx = p.x - c.x, dy = p.y - c.y, rr = pr + c.r;
        if (dx * dx + dy * dy < rr * rr) { gameOver(); return; }
      }
      for (const pf of puffers) {
        if (!pf.active) continue;
        const dx = p.x - pf.x, dy = p.y - pf.y, rr = pr + pf.r;
        if (dx * dx + dy * dy < rr * rr) { gameOver(); return; }
      }
    }
  }

  function updateDeathFish(dt) {
    if (!deathFish) return;
    deathFish.vy += scaled(CFG.gameOverFallGravity) * dt;
    deathFish.x += deathFish.vx * dt;
    deathFish.y += deathFish.vy * dt;
    deathFish.rot += deathFish.vr * dt;

    // 画面下へ落ちた後は、見えない位置で止めて無駄な数値発散を避ける。
    const bottom = cameraY + CFG.logicHeight + 90;
    if (deathFish.y > bottom) {
      deathFish.y = bottom;
      deathFish.vy = 0;
      deathFish.vx *= 0.92;
      deathFish.vr *= 0.92;
    }
  }

  function updateEntities(dt) {
    for (const sh of sharks) {
      if (!sh.active) continue;
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.turnTimer -= dt;
      if (sh.turnTimer <= 0) {
        sh.turnTimer = 1 + Math.random() * 2;
        sh.vx += (Math.random() - 0.5) * 60;
        sh.vy += (Math.random() - 0.5) * 40;
        const maxSX = 140, maxSY = 80;
        if (sh.vx > maxSX) sh.vx = maxSX;
        if (sh.vx < -maxSX) sh.vx = -maxSX;
        if (sh.vy > maxSY) sh.vy = maxSY;
        if (sh.vy < -maxSY) sh.vy = -maxSY;
      }
      if (sh.x < 20) { sh.x = 20; sh.vx = Math.abs(sh.vx); }
      if (sh.x > CFG.logicWidth - 20) { sh.x = CFG.logicWidth - 20; sh.vx = -Math.abs(sh.vx); }
      if (sh.y < cameraY + 20) { sh.y = cameraY + 20; sh.vy = Math.abs(sh.vy); }
      if (sh.y > cameraY + CFG.logicHeight - 20) { sh.y = cameraY + CFG.logicHeight - 20; sh.vy = -Math.abs(sh.vy); }
      sh.facing = sh.vx >= 0 ? 1 : -1;
    }

    for (const wh of whales) {
      if (!wh.active) continue;
      wh.bob += dt * 1.2;
      wh.x += wh.vx * dt;
      wh.y += (wh.vy + Math.sin(wh.bob) * 10) * dt;
      wh.turnTimer -= dt;
      if (wh.turnTimer <= 0) {
        wh.turnTimer = 2.2 + Math.random() * 2.8;
        wh.vx += (Math.random() - 0.5) * 24;
        wh.vy += (Math.random() - 0.5) * 14;
        const maxWX = 58, maxWY = 28;
        if (wh.vx > maxWX) wh.vx = maxWX;
        if (wh.vx < -maxWX) wh.vx = -maxWX;
        if (wh.vy > maxWY) wh.vy = maxWY;
        if (wh.vy < -maxWY) wh.vy = -maxWY;
      }
      if (wh.x < 70) { wh.x = 70; wh.vx = Math.abs(wh.vx); }
      if (wh.x > CFG.logicWidth - 70) { wh.x = CFG.logicWidth - 70; wh.vx = -Math.abs(wh.vx); }
      if (wh.y < cameraY + 50) { wh.y = cameraY + 50; wh.vy = Math.abs(wh.vy); }
      if (wh.y > cameraY + CFG.logicHeight - 50) { wh.y = cameraY + CFG.logicHeight - 50; wh.vy = -Math.abs(wh.vy); }
      wh.facing = wh.vx >= 0 ? 1 : -1;
    }

    for (const c of crabs) {
      if (!c.active) continue;
      c.x += c.vx * dt;
      if (c.x < c.left) { c.x = c.left; c.vx = Math.abs(c.vx); }
      if (c.x > c.right) { c.x = c.right; c.vx = -Math.abs(c.vx); }
    }

    for (const pf of puffers) {
      if (!pf.active) continue;
      pf.x += pf.vx * dt;
      pf.y += pf.vy * dt;

      // 膨張/収縮：0..1 の呼吸波で scale と当たり半径を連動させる。
      pf.breath += CFG.pufferBreath * dt;
      const t = 0.5 + 0.5 * Math.sin(pf.breath);
      pf.scale = CFG.pufferBaseScale + (CFG.pufferMaxScale - CFG.pufferBaseScale) * t;
      pf.r = CFG.pufferRadiusMin + (CFG.pufferRadiusMax - CFG.pufferRadiusMin) * t;

      // 画面（カメラ範囲）で跳ね返る。半径ぶん内側で反射させて食い込みを防ぐ。
      const rad = pf.r;
      if (pf.x < rad) { pf.x = rad; pf.vx = Math.abs(pf.vx); }
      if (pf.x > CFG.logicWidth - rad) { pf.x = CFG.logicWidth - rad; pf.vx = -Math.abs(pf.vx); }
      if (pf.y < cameraY + rad) { pf.y = cameraY + rad; pf.vy = Math.abs(pf.vy); }
      if (pf.y > cameraY + CFG.logicHeight - rad) { pf.y = cameraY + CFG.logicHeight - rad; pf.vy = -Math.abs(pf.vy); }
      pf.facing = pf.vx >= 0 ? 1 : -1;
    }

    for (const b of bubbles) {
      b.y -= b.speed * dt;
      b.x += Math.sin(b.wobble + playTime * 2) * 0.5;
      b.wobble += dt * 2;
      if (b.y < cameraY - 10) {
        b.y = cameraY + CFG.logicHeight + 10;
        b.x = Math.random() * CFG.logicWidth;
      }
    }

    if (topDanger > 0) {
      for (const b of dangerBubbles) {
        b.y -= b.speed * dt;
        b.x += Math.sin(b.wobble + playTime * 3) * 0.8;
        b.wobble += dt * 2.4;
        if (b.y < -80) {
          b.y = 16 + Math.random() * 42;
          b.x = Math.random() * CFG.logicWidth;
        }
      }
    }

    // ===== 音符オーラ（🎧効果中） =====
    if (player && player.musicTimer > 0 && state === "playing") {
      player.musicTimer -= dt;
      if (player.musicTimer < 0) player.musicTimer = 0;

      // 一定間隔で🐟から全方位ランダムに音符を放出。🎵と🎶を交互に。
      player.noteAcc += dt;
      while (player.noteAcc >= CFG.noteEmitInterval && notes.length < CFG.maxNotes) {
        player.noteAcc -= CFG.noteEmitInterval;
        for (let k = 0; k < CFG.noteEmitPerTick && notes.length < CFG.maxNotes; k++) {
          const ang = Math.random() * Math.PI * 2;
          player.nextNoteBig = !player.nextNoteBig;
          const ox = Math.cos(ang) * 6, oy = Math.sin(ang) * 6;
          notes.push(makeNote(player.x + ox, player.y + oy, ang, player.nextNoteBig));
        }
      }
    }

    // 音符の移動・寿命・敵ヒット。
    const rangeSq = CFG.noteRange * CFG.noteRange;
    for (const n of notes) {
      if (!n.active) continue;
      n.x += n.vx * dt;
      n.y += n.vy * dt;
      n.rot += n.spin * dt;

      // 🐟から離れすぎたら消える（近距離オーラ）。
      if (player) {
        const ddx = n.x - player.x, ddy = n.y - player.y;
        if (ddx * ddx + ddy * ddy > rangeSq) { n.active = false; continue; }
      }

      // 🐚以外の active な敵に当たると、敵と音符の両方が消える（クジラはHP制）。
      let consumed = false;
      for (const c of crabs) {
        if (!c.active) continue;
        const dx = n.x - c.x, dy = n.y - c.y, rr = n.r + c.r;
        if (dx * dx + dy * dy < rr * rr) { c.active = false; spawnPopParticles(c.x, c.y); consumed = true; break; }
      }
      if (consumed) { n.active = false; continue; }
      for (const sh of sharks) {
        if (!sh.active) continue;
        const dx = n.x - sh.x, dy = n.y - sh.y, rr = n.r + sh.r;
        if (dx * dx + dy * dy < rr * rr) { sh.active = false; spawnPopParticles(sh.x, sh.y); consumed = true; break; }
      }
      if (consumed) { n.active = false; continue; }
      for (const pf of puffers) {
        if (!pf.active) continue;
        const dx = n.x - pf.x, dy = n.y - pf.y, rr = n.r + pf.r;
        if (dx * dx + dy * dy < rr * rr) { pf.active = false; spawnPopParticles(pf.x, pf.y); consumed = true; break; }
      }
      if (consumed) { n.active = false; continue; }
      for (const wh of whales) {
        if (!wh.active) continue;
        const dx = n.x - wh.x, dy = n.y - wh.y, rr = n.r + wh.r;
        if (dx * dx + dy * dy < rr * rr) {
          wh.hp -= 1;
          spawnPopParticles(n.x, n.y);
          if (wh.hp <= 0) { wh.active = false; spawnPopParticles(wh.x, wh.y); }
          consumed = true;
          break;
        }
      }
      if (consumed) { n.active = false; continue; }
    }

    // 🎧 のふわふわ演出だけ更新（当たり判定は updatePhysics 側）。
    for (const pu of powerups) {
      if (pu.active) pu.bob += dt * 2;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 30 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function updateCameraAndScroll(dt) {
    if (state !== "playing") return;
    scrollSpeed += CFG.scrollRamp * dt * 60;
    if (scrollSpeed > CFG.scrollMax) scrollSpeed = CFG.scrollMax;

    const dy = scrollSpeed * dt;
    cameraY += dy;
    worldScroll += dy;
    if (worldScroll > maxScroll) maxScroll = worldScroll;

    const screenY = player.y - cameraY;
    // 魚が画面上へ隠れたら即終了ではなく、少しだけ猶予を残す。
    // その間は魚本体ではなく、上端の泡で危険状態を示す。
    topDanger = Math.max(0, Math.min(1, -screenY / CFG.cameraMarginTop));
    if (screenY < -CFG.cameraMarginTop) { gameOver(); return; }
    if (screenY > CFG.logicHeight + CFG.cameraMarginBottom) { gameOver(); return; }
  }

  // ===== Game flow =====
  function startGame() {
    resetWorld();
    // 短い開始演出だけ挟み、長い操作不能時間をなくす。
    state = "intro";
    startBannerTimer = CFG.startBannerTime;
    invulnTimer = CFG.startInvulnTime;
    if (player) {
      player.invuln = true;
      spawnSplash(player.x, player.y - player.hh - 8);
    }
    setFocus(true);
  }

  function gameOver() {
    if (state === "gameover") return;
    state = "gameover";
    shake = 0.35;
    dim = 0.7;
    if (player) {
      player.musicTimer = 0;
      player.noteAcc = 0;
      notes.length = 0;
      deathFish = {
        x: player.x,
        y: player.y,
        vx: Math.max(-160, Math.min(160, player.vx * 0.55 + (Math.random() - 0.5) * 80)),
        vy: -120,
        rot: 0,
        vr: (Math.random() < 0.5 ? -1 : 1) * CFG.gameOverFallSpin,
        facing: player.facing || 1,
      };
      spawnDeathBubbles(player.x, player.y);
    }
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    const best = Math.floor(bestDepth / CFG.scrollUnit);
    if (depth > best) {
      bestDepth = maxScroll;
      saveBest();
    }
  }

  // ===== Drawing =====
  function drawBackground() {
    if (!bgGradient) {
      bgGradient = ctx.createLinearGradient(0, 0, 0, CFG.logicHeight);
      bgGradient.addColorStop(0, "#0a2e5c");
      bgGradient.addColorStop(1, "#020714");
    }
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    const surfaceScreenY = 0 - cameraY;
    if (surfaceScreenY > -20 && surfaceScreenY < CFG.logicHeight + 20) {
      ctx.fillStyle = "rgba(120,210,255,0.25)";
      ctx.fillRect(0, surfaceScreenY, CFG.logicWidth, 6);
      ctx.fillStyle = "rgba(180,240,255,0.15)";
      ctx.fillRect(0, surfaceScreenY + 6, CFG.logicWidth, 18);
    }
  }

  function drawBubbles() {
    // 通常プレイ中、魚が見えている時の常時泡は情報量が増えるだけなので抑える。
    // タイトル・ゲームオーバー・上部アウト猶予中だけ泡を意味のある表示として使う。
    if (state === "playing" && topDanger <= 0) return;

    ctx.save();
    const ambientAlpha = state === "playing" ? 0.12 : 0.35;
    for (const b of bubbles) {
      const sy = b.y - cameraY;
      if (sy < -5 || sy > CFG.logicHeight + 5) continue;
      ctx.globalAlpha = ambientAlpha;
      ctx.fillStyle = "#a8e6ff";
      ctx.beginPath();
      ctx.arc(b.x, sy, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTopDanger() {
    if (state !== "playing" || topDanger <= 0) return;
    ctx.save();
    const alpha = Math.min(1, 0.25 + topDanger * 0.75);

    if (!dangerGradient) {
      dangerGradient = ctx.createLinearGradient(0, 0, 0, 96);
      dangerGradient.addColorStop(0, "rgba(0, 3, 10, 0.72)");
      dangerGradient.addColorStop(1, "rgba(0, 3, 10, 0)");
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = dangerGradient;
    ctx.fillRect(0, 0, CFG.logicWidth, 110);
    ctx.globalAlpha = 1;

    ctx.fillStyle = `rgba(185, 238, 255, ${0.25 + 0.45 * topDanger})`;
    for (const b of dangerBubbles) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * (0.8 + topDanger * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = "bold 14px sans-serif";
    ctx.fillStyle = `rgba(210, 248, 255, ${alpha})`;
    ctx.shadowColor = "rgba(80, 210, 255, 0.75)";
    ctx.shadowBlur = 10;
    ctx.fillText("上へ流されている", CFG.logicWidth / 2, 14);
    ctx.restore();
  }

  function drawPlatforms() {
    for (const pl of platforms) {
      const sy = pl.y - cameraY;
      if (sy < -30 || sy > CFG.logicHeight + 30) continue;
      ctx.save();
      ctx.shadowColor = "rgba(0, 180, 255, 0.35)";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(10, 80, 140, 0.9)";
      ctx.fillRect(pl.x, sy, pl.w, pl.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(60, 180, 255, 0.25)";
      const flow = (playTime * 40 + pl.flowOffset) % 24;
      for (let i = -24; i < pl.w; i += 24) {
        ctx.fillRect(pl.x + i + flow, sy + 3, 10, 3);
        ctx.fillRect(pl.x + i + flow - 12, sy + 10, 10, 3);
      }
      ctx.fillStyle = "rgba(140, 220, 255, 0.5)";
      ctx.fillRect(pl.x, sy, pl.w, 2);
      ctx.restore();
    }
  }

  function drawShells() {
    const sp = SPRITES.shell;
    for (const s of shells) {
      if (!s.active) continue;
      const sy = s.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      drawSprite(sp, s.x, sy, -1, 1, 0);
    }
  }

  function drawPowerups() {
    const sp = SPRITES.phones;
    for (const pu of powerups) {
      if (!pu.active) continue;
      const sy = pu.y - cameraY + Math.sin(pu.bob) * 3;   // ゆっくり上下
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      drawSprite(sp, pu.x, sy, -1, 1, 0);
    }
  }

  function drawMusicAura() {
    if (!player || player.musicTimer <= 0 || state !== "playing") return;
    const sx = player.x, sy = player.y - cameraY;
    const pulse = 0.5 + 0.5 * Math.sin(playTime * 6);
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.10 * pulse;
    ctx.strokeStyle = "rgba(150, 240, 255, 0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy, CFG.noteRange * (0.85 + 0.1 * pulse), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawNotes() {
    for (const n of notes) {
      if (!n.active) continue;
      const sy = n.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      drawSprite(n.big ? SPRITES.note2 : SPRITES.note1, n.x, sy, -1, 0.95, n.rot);
    }
  }

  function drawSharks() {
    const sp = SPRITES.shark;
    for (const sh of sharks) {
      if (!sh.active) continue;
      const sy = sh.y - cameraY;
      if (sy < -30 || sy > CFG.logicHeight + 30) continue;
      drawSprite(sp, sh.x, sy, sh.facing, 1, 0);
    }
  }

  function drawWhales() {
    const sp = SPRITES.whale;
    for (const wh of whales) {
      if (!wh.active) continue;
      const sy = wh.y - cameraY;
      if (sy < -120 || sy > CFG.logicHeight + 120) continue;
      drawSprite(sp, wh.x, sy, wh.facing, 1, 0);
    }
  }

  function drawPuffers() {
    const sp = SPRITES.puffer;
    for (const pf of puffers) {
      if (!pf.active) continue;
      const sy = pf.y - cameraY;
      if (sy < -90 || sy > CFG.logicHeight + 90) continue;
      // 最大サイズで焼いたスプライトを、現在の膨張率まで縮小して描く。
      drawSprite(sp, pf.x, sy, pf.facing, 1, 0, pf.scale);
    }
  }

  function drawCrabs() {
    const sp = SPRITES.crab;
    for (const c of crabs) {
      if (!c.active) continue;
      const sy = c.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      drawSprite(sp, c.x, sy, -1, 1, 0);
    }
  }

  function drawDeathFish() {
    if (!deathFish) return;
    const sy = deathFish.y - cameraY;
    if (sy < -80 || sy > CFG.logicHeight + 120) return;

    // 魚本体は焼き込み済みスプライトで描く。
    drawSprite(SPRITES.fish, deathFish.x, sy, deathFish.facing, 0.9, deathFish.rot);

    // やられた感じを出す小さな気泡。
    ctx.save();
    ctx.translate(deathFish.x, sy);
    ctx.rotate(deathFish.rot);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#b9eeff";
    ctx.beginPath();
    ctx.arc(-10, -18, 2.4, 0, Math.PI * 2);
    ctx.arc(8, -24, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    if (!player) return;
    // 絵文字はサブピクセル位置 + 強いshadowでぼやけやすいので、描画位置を丸める。
    const sx = Math.round(player.x);
    const sy = Math.round(player.y - cameraY);

    if (player.invuln || state === "intro") {
      ctx.save();
      ctx.strokeStyle = "rgba(180, 245, 255, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, CFG.playerEmojiSize * 0.58, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 発光込みで焼いた魚スプライトを、丸めた座標に等倍で描く。
    drawSprite(SPRITES.fish, sx, sy, player.facing, 1, 0);
  }

  function drawParticles() {
    for (const pt of particles) {
      const sy = pt.y - cameraY;
      if (sy < -10 || sy > CFG.logicHeight + 10) continue;
      ctx.globalAlpha = Math.min(1, Math.max(0, pt.life / (pt.maxLife || 1)));
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, sy, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    ctx.fillStyle = "rgba(0, 10, 30, 0.6)";
    ctx.fillRect(CFG.logicWidth - 140, 10, 130, 30);
    ctx.strokeStyle = "rgba(100, 200, 255, 0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(CFG.logicWidth - 140, 10, 130, 30);
    ctx.fillStyle = "#c2f0ff";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(depth + " scroll", CFG.logicWidth - 18, 25);

    // 🎧効果の残り時間バー。
    if (player && player.musicTimer > 0) {
      const ratio = Math.max(0, Math.min(1, player.musicTimer / CFG.musicDuration));
      const bx = CFG.logicWidth - 140, by = 46, bw = 130, bh = 8;
      ctx.fillStyle = "rgba(0, 10, 30, 0.6)";
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = "rgba(150, 240, 255, 0.9)";
      ctx.fillRect(bx, by, bw * ratio, bh);
      ctx.strokeStyle = "rgba(100, 200, 255, 0.4)";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = "#c2f0ff";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText("🎧 " + player.musicTimer.toFixed(1) + "s", bx + bw, by - 1);
    }

    if (helpVisible && helpTimer > 0) {
      ctx.fillStyle = "rgba(0, 10, 30, 0.55)";
      ctx.fillRect(10, CFG.logicHeight - 32, 350, 24);
      ctx.strokeStyle = "rgba(100, 200, 255, 0.25)";
      ctx.strokeRect(10, CFG.logicHeight - 32, 350, 24);
      ctx.fillStyle = "#8ecae6";
      ctx.font = "12px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("←: 左　→: 右　↑: ホップ　↓: ダイブ　Esc: 一時停止　?: ヘルプ", 18, CFG.logicHeight - 20);
    }
  }

  function drawStartBanner() {
    if (state !== "intro" && startBannerTimer <= 0) return;
    const t = state === "intro" ? Math.max(0, introTimer / CFG.introDuration) : Math.max(0, startBannerTimer / CFG.startBannerTime);
    const alpha = Math.max(0, Math.min(1, t));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(0, 12, 30, 0.35)";
    ctx.fillRect(0, CFG.logicHeight * 0.38, CFG.logicWidth, 84);
    ctx.font = "bold 32px sans-serif";
    ctx.fillStyle = "#e8fbff";
    ctx.shadowColor = "rgba(80, 210, 255, 0.95)";
    ctx.shadowBlur = 18;
    ctx.fillText("🐠  START", CFG.logicWidth / 2, CFG.logicHeight * 0.45);
    ctx.font = "14px sans-serif";
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#9fe7ff";
    ctx.fillText("海流に乗って深海へ", CFG.logicWidth / 2, CFG.logicHeight * 0.53);
    ctx.restore();
  }

  function drawTitle() {
    drawBackground();
    drawBubbles();

    ctx.save();
    ctx.fillStyle = "rgba(0, 6, 18, 0.55)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    ctx.fillStyle = "#e0f7ff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "bold 34px sans-serif";
    ctx.fillText("深海潜行", CFG.logicWidth / 2, CFG.logicHeight * 0.28);

    ctx.font = "16px sans-serif";
    ctx.fillStyle = "#a8d8f0";
    ctx.fillText("深海へ潜り続けよう", CFG.logicWidth / 2, CFG.logicHeight * 0.40);

    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#7eb8d4";
    ctx.fillText("B：左移動　F：右移動", CFG.logicWidth / 2, CFG.logicHeight * 0.52);
    ctx.fillText("P：ホップ　N：ダイブ", CFG.logicWidth / 2, CFG.logicHeight * 0.58);
    ctx.fillText("Enterでスタート", CFG.logicWidth / 2, CFG.logicHeight * 0.68);

    const best = Math.floor(bestDepth / CFG.scrollUnit);
    ctx.fillStyle = "#5c9ebf";
    ctx.fillText("ベスト深度：" + best + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.78);
    ctx.fillStyle = "#3d7a9c";
    ctx.fillText("Shift+3 でベスト深度リセット", CFG.logicWidth / 2, CFG.logicHeight * 0.84);

    if (!focus) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillText("ゲーム画面をクリックして操作", CFG.logicWidth / 2, CFG.logicHeight * 0.92);
    }
    ctx.restore();
  }

  function drawPaused() {
    ctx.save();
    ctx.fillStyle = "rgba(0, 6, 18, 0.65)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    ctx.fillStyle = "#e0f7ff";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("PAUSED", CFG.logicWidth / 2, CFG.logicHeight * 0.45);
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#8ecae6";
    ctx.fillText("Space で再開　Esc でタイトルへ戻る", CFG.logicWidth / 2, CFG.logicHeight * 0.55);
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    if (dim > 0) {
      ctx.fillStyle = `rgba(0, 3, 12, ${dim * 0.85})`;
      ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    }
    ctx.fillStyle = "rgba(0, 6, 18, 0.55)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    ctx.fillStyle = "#ff5c5c";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("GAME OVER", CFG.logicWidth / 2, CFG.logicHeight * 0.32);

    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    const best = Math.floor(bestDepth / CFG.scrollUnit);
    ctx.fillStyle = "#c2f0ff";
    ctx.font = "16px sans-serif";
    ctx.fillText("今回の最大深度：" + depth + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.46);
    ctx.fillStyle = "#8ecae6";
    ctx.fillText("ベスト深度：" + best + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.54);

    ctx.fillStyle = "#a8d8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("Enter / R でもう一度", CFG.logicWidth / 2, CFG.logicHeight * 0.66);
    ctx.fillText("Esc でタイトルへ", CFG.logicWidth / 2, CFG.logicHeight * 0.74);
    ctx.restore();
  }

  function applyShake() {
    if (shake > 0) {
      const intensity = 6;
      const dx = (Math.random() - 0.5) * intensity;
      const dy = (Math.random() - 0.5) * intensity;
      ctx.translate(dx, dy);
    }
  }

  // ===== Main loop =====
  // 説明書リンクはタイトルとゲームオーバーの時だけ出す。
  // プレイ中・一時停止中・開始演出中は誤クリック防止のため表示しない。
  let manualShown = false;
  function syncManualLink() {
    const show = state === "title" || state === "gameover";
    if (show !== manualShown) {
      manualShown = show;
      manualLink.classList.toggle("show", show);
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.5) dt = 0.5;

    syncManualLink();

    if (state === "title") {
      drawTitle();
      return;
    }

    const step = CFG.maxDt;
    acc += dt;
    if (acc > CFG.accumulatorMax) acc = CFG.accumulatorMax;

    while (acc >= step) {
      if (state === "intro") {
        introTimer -= step;
        playTime += step;

        if (player && startPlatform) {
          player.x = startPlatform.x + startPlatform.w / 2;
          player.y = startPlatform.y - player.hh;
          player.vx = 0;
          player.vy = 0;
          player.grounded = true;
        }

        // ごく短い演出中だけ、世界をほんの少し動かして潜行開始感を出す。
        const introScroll = scrollSpeed * 0.18 * step;
        cameraY += introScroll;
        worldScroll += introScroll;
        if (worldScroll > maxScroll) maxScroll = worldScroll;

        if (introTimer <= 0) {
          introTimer = 0;
          state = "playing";
          if (player && startPlatform) {
            player.x = startPlatform.x + startPlatform.w / 2;
            player.y = startPlatform.y - player.hh;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
            player.diveIgnore = 0;
            player.airDiveUsed = false;
            player.invuln = true;
            invulnTimer = CFG.startInvulnTime;
          }
        }
      } else if (state === "playing") {
        if (invulnTimer > 0) {
          invulnTimer -= step;
          if (invulnTimer <= 0 && player) {
            invulnTimer = 0;
            player.invuln = false;
          }
        }
        if (startBannerTimer > 0) {
          startBannerTimer -= step;
          if (startBannerTimer < 0) startBannerTimer = 0;
        }
        if (helpTimer > 0) {
          helpTimer -= step;
          if (helpTimer < 0) helpTimer = 0;
        }
        updatePhysics(step);
        if (state === "playing") updateCameraAndScroll(step);
        if (state === "playing") {
          updateEntities(step);
          playTime += step;
          generateUntil(cameraY + CFG.logicHeight + 200);
          spawnPowerupIfDue();
          cleanup(cameraY);
        }
      } else if (state === "gameover") {
        updateEntities(step);
        updateDeathFish(step);
        if (shake > 0) shake -= step;
        if (dim > 0) dim -= step * 0.3;
        if (dim < 0) dim = 0;
      } else if (state === "paused") {
        // no updates
      }
      acc -= step;
    }

    ctx.save();
    ctx.clearRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    applyShake();
    drawBackground();
    drawBubbles();
    drawPlatforms();
    drawShells();
    drawPowerups();
    drawCrabs();
    drawSharks();
    drawPuffers();
    drawWhales();
    drawMusicAura();
    if (state === "gameover") drawDeathFish();
    else drawPlayer();
    drawNotes();
    drawParticles();
    drawTopDanger();
    drawHUD();
    drawStartBanner();
    ctx.restore();

    // UIオーバーレイは揺らさず読みやすく保つ
    ctx.save();
    if (state === "paused") drawPaused();
    if (state === "gameover") drawGameOver();
    ctx.restore();
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
