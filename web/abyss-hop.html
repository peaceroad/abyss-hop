<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深海潜行 - Abyss Hop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020d1f;
    color: #e0f7ff;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-wrapper {
    position: relative;
    width: min(100vw, calc(100dvh * 4 / 3));
    height: min(100dvh, calc(100vw * 3 / 4));
    aspect-ratio: 4 / 3;
    box-sizing: border-box;
    background: #000;
    box-shadow: 0 0 40px rgba(0, 150, 255, 0.25);
    border: 2px solid #0b2e4f;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  #focus-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 10, 30, 0.85);
    border: 1px solid #1b6f9c;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    color: #8fd7ff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }
  #focus-hint.show {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas" tabindex="0"></canvas>
  <div id="focus-hint">ゲーム画面をクリックして操作</div>
</div>
<script>
(() => {
  "use strict";

  // ===== Configuration =====
  const CFG = {
    logicWidth: 800,
    logicHeight: 600,
    gravity: 1800,
    hopVel: -650,
    diveVel: 520,
    moveAccel: 800,
    maxRunSpeed: 220,
    friction: 0.82,
    airDrag: 0.96,
    scrollBase: 90,
    scrollMax: 280,
    scrollRamp: 0.003,
    cameraMarginTop: 120,
    cameraMarginBottom: 60,
    shellRadius: 14,
    shellEmojiSize: 30,
    sharkRadius: 14,
    sharkEmojiSize: 30,
    crabRadius: 14,
    crabEmojiSize: 30,
    whaleRadius: 52,
    whaleEmojiSize: 108,
    playerW: 34,
    playerH: 26,
    playerHitShrink: 3,
    playerEmojiSize: 30,
    introDuration: 0.28,
    safeStartTime: 3.2,
    diveIgnoreTime: 0.18,
    maxDt: 0.033,
    accumulatorMax: 0.1,
    bubbleCount: 26,
    dangerBubbleCount: 12,
    scrollUnit: 120,
    enemySafeDist: 145,
    startBannerTime: 0.85,
    startInvulnTime: 0.65,
    gameOverFallGravity: 1700,
    gameOverFallSpin: 5.2,
    firstEnemyTime: 2.0,
    firstCrabTime: 2.4,
    firstSharkTime: 2.8,
    firstWhaleTime: 24,
  };

  // ===== State =====
  const canvas = document.getElementById("gameCanvas");
  const wrapper = document.getElementById("game-wrapper");
  const focusHint = document.getElementById("focus-hint");
  const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

  let state = "title";
  let lastTime = 0;
  let acc = 0;
  let focus = false;
  let bestDepth = 0;
  let shake = 0;
  let dim = 0;
  let topDanger = 0;
  let deathFish = null;

  const keys = new Set();
  const latched = { p: false, n: false };

  let worldScroll = 0;
  let maxScroll = 0;
  let scrollSpeed = CFG.scrollBase;
  let introTimer = 0;
  let playTime = 0;
  let startBannerTimer = 0;
  let invulnTimer = 0;

  let player = null;
  let platforms = [];
  let shells = [];
  let sharks = [];
  let whales = [];
  let crabs = [];
  let bubbles = [];
  let dangerBubbles = [];
  let particles = [];

  let cameraY = 0;
  let generatedUntil = 0;
  let startPlatform = null;

  // ===== localStorage =====
  function loadBest() {
    try {
      const v = localStorage.getItem("abyss_best_depth");
      if (v) bestDepth = Math.max(0, parseInt(v, 10) || 0);
    } catch (e) { bestDepth = 0; }
  }
  function saveBest() {
    try {
      localStorage.setItem("abyss_best_depth", String(bestDepth));
    } catch (e) {}
  }
  loadBest();

  // タイトル画面にも泡を出し、初回ゲーム開始時の初期化集中を少し減らす。
  resetBubbles();
  resetDangerBubbles();

  // ===== Resize =====
  let lastCanvasWidth = 0;
  let lastCanvasHeight = 0;
  let lastCanvasDpr = 0;

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nextWidth = Math.max(1, Math.floor(rect.width * dpr));
    const nextHeight = Math.max(1, Math.floor(rect.height * dpr));

    // Canvasのwidth/height再設定は内部バッファ再確保を伴うため、必要な時だけ行う。
    if (nextWidth !== lastCanvasWidth || nextHeight !== lastCanvasHeight || dpr !== lastCanvasDpr) {
      canvas.width = nextWidth;
      canvas.height = nextHeight;
      lastCanvasWidth = nextWidth;
      lastCanvasHeight = nextHeight;
      lastCanvasDpr = dpr;
    }

    // Canvasの実表示サイズとゲーム内論理解像度を分離してスケーリングする。
    const scaleX = rect.width / CFG.logicWidth;
    const scaleY = rect.height / CFG.logicHeight;
    ctx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ===== Focus =====
  function setFocus(v) {
    focus = v;
    if (v) {
      canvas.focus();
      focusHint.classList.remove("show");
    } else {
      focusHint.classList.add("show");
      keys.clear();
      latched.p = false;
      latched.n = false;
      if (state === "playing") state = "paused";
    }
  }
  canvas.addEventListener("focus", () => setFocus(true));
  canvas.addEventListener("blur", () => setFocus(false));
  wrapper.addEventListener("click", () => {
    // クリックはフォーカス取得だけ。開始・再開はキー操作で統一する。
    setFocus(true);
  });
  window.addEventListener("blur", () => setFocus(false));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setFocus(false);
  });

  // ===== Input =====
  function codeKey(code) {
    switch (code) {
      case "KeyB": return "b";
      case "KeyF": return "f";
      case "KeyP": return "p";
      case "KeyN": return "n";
      case "KeyR": return "r";
      case "Enter": return "enter";
      case "Space": return "space";
      case "Escape": return "esc";
      default: return null;
    }
  }

  window.addEventListener("keydown", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "b" || k === "f" || k === "enter" || k === "space" || k === "esc" || k === "r") {
      e.preventDefault();
    }
    if (k === "p" || k === "n") {
      e.preventDefault();
      if (e.repeat) return;
      if (k === "p" && !latched.p) { latched.p = true; onPressEdge("p"); }
      if (k === "n" && !latched.n) { latched.n = true; onPressEdge("n"); }
      return;
    }
    keys.add(k);
    if (k === "enter") {
      if (state === "title" || state === "gameover") startGame();
    }
    if (k === "r") {
      if (state === "gameover") startGame();
    }
    if (k === "space") {
      if (state === "paused") state = "playing";
    }
    if (k === "esc") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "title";
      else if (state === "gameover") state = "title";
    }
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "p") { latched.p = false; }
    if (k === "n") { latched.n = false; }
    keys.delete(k);
  });

  function widthScale() {
    // 800px幅を基準にした物理スケール。
    // 今は論理解像度800なので従来と同じだが、画面幅基準で調整しやすくしておく。
    return CFG.logicWidth / 800;
  }

  function scaled(v) {
    return v * widthScale();
  }

  function onPressEdge(action) {
    if (state !== "playing") return;
    if (!player) return;
    if (action === "p") {
      if (player.grounded) {
        player.vy = scaled(CFG.hopVel);
        player.grounded = false;
        spawnHopParticles(player.x, player.y + player.hh);
      }
    } else if (action === "n") {
      if (player.grounded) {
        player.diveIgnore = CFG.diveIgnoreTime;
        player.vy = scaled(CFG.diveVel);
        player.grounded = false;
        player.airDiveUsed = false;
      } else if (!player.airDiveUsed) {
        player.vy = scaled(CFG.diveVel);
        player.airDiveUsed = true;
      }
    }
  }

  // ===== Entities =====
  function makePlayer() {
    return {
      x: CFG.logicWidth / 2,
      y: 0,
      vx: 0,
      vy: 0,
      hw: CFG.playerW / 2,
      hh: CFG.playerH / 2,
      grounded: false,
      diveIgnore: 0,
      airDiveUsed: false,
      facing: 1,
      invuln: true,
    };
  }

  function makePlatform(y, x, w) {
    return { x, y, w, h: 18, flowOffset: Math.random() * 1000 };
  }

  function makeShell(x, y) {
    return { x, y, r: CFG.shellRadius, active: true };
  }

  function makeShark(x, y) {
    return {
      x, y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 60),
      vy: (Math.random() - 0.5) * 40,
      r: CFG.sharkRadius,
      turnTimer: 1 + Math.random() * 2,
      facing: 1,
    };
  }

  function makeWhale(x, y) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    return {
      x, y,
      vx: dir * (24 + Math.random() * 24),
      vy: (Math.random() - 0.5) * 16,
      r: CFG.whaleRadius,
      turnTimer: 2.5 + Math.random() * 2.5,
      facing: dir,
      bob: Math.random() * Math.PI * 2,
    };
  }

  function makeCrab(x, y, left, right) {
    return {
      x, y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 30),
      r: CFG.crabRadius,
      left, right,
      active: true,
    };
  }

  function makeBubble() {
    return {
      x: Math.random() * CFG.logicWidth,
      y: Math.random() * CFG.logicHeight,
      r: 1 + Math.random() * 2.5,
      speed: 20 + Math.random() * 40,
      wobble: Math.random() * Math.PI * 2,
    };
  }

  function resetBubbles() {
    for (let i = 0; i < CFG.bubbleCount; i++) {
      const b = bubbles[i] || (bubbles[i] = makeBubble());
      b.x = Math.random() * CFG.logicWidth;
      b.y = Math.random() * CFG.logicHeight;
      b.r = 1 + Math.random() * 2.5;
      b.speed = 20 + Math.random() * 40;
      b.wobble = Math.random() * Math.PI * 2;
    }
    bubbles.length = CFG.bubbleCount;
  }

  function makeDangerBubble() {
    return {
      x: Math.random() * CFG.logicWidth,
      y: -8 - Math.random() * 46,
      r: 2 + Math.random() * 4,
      speed: 18 + Math.random() * 46,
      wobble: Math.random() * Math.PI * 2,
    };
  }

  function resetDangerBubbles() {
    for (let i = 0; i < CFG.dangerBubbleCount; i++) {
      const b = dangerBubbles[i] || (dangerBubbles[i] = makeDangerBubble());
      b.x = Math.random() * CFG.logicWidth;
      b.y = -10 - Math.random() * 64;
      b.r = 2 + Math.random() * 4;
      b.speed = 18 + Math.random() * 46;
      b.wobble = Math.random() * Math.PI * 2;
    }
    dangerBubbles.length = CFG.dangerBubbleCount;
  }

  function spawnHopParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 120,
        vy: Math.random() * 60,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 1,
        r: 1.5 + Math.random() * 2,
        color: "rgba(160,230,255,0.9)",
      });
    }
  }

  function spawnSplash(x, y) {
    for (let i = 0; i < 20; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 200,
        vy: -Math.random() * 180,
        life: 0.8 + Math.random() * 0.5,
        maxLife: 1,
        r: 2 + Math.random() * 3,
        color: "rgba(200,245,255,0.95)",
      });
    }
  }

  function spawnDeathBubbles(x, y) {
    for (let i = 0; i < 30; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 100,
        vy: -20 - Math.random() * 120,
        life: 1.2 + Math.random() * 1.0,
        maxLife: 1,
        r: 2 + Math.random() * 4,
        color: "rgba(180,230,255,0.85)",
      });
    }
  }

  // ===== Generation =====
  function resetWorld() {
    player = makePlayer();
    platforms.length = 0;
    shells.length = 0;
    crabs.length = 0;
    sharks.length = 0;
    whales.length = 0;
    particles.length = 0;
    resetBubbles();
    resetDangerBubbles();
    worldScroll = 0;
    maxScroll = 0;
    scrollSpeed = CFG.scrollBase;
    playTime = 0;
    startBannerTimer = 0;
    invulnTimer = 0;
    shake = 0;
    dim = 0;
    topDanger = 0;
    deathFish = null;

    // First platform: long and safe, place player directly on it
    startPlatform = makePlatform(120, 0, 340);
    platforms.push(startPlatform);
    platforms.push(makePlatform(245, CFG.logicWidth * 0.38, 250));
    platforms.push(makePlatform(370, CFG.logicWidth - 310, 310));
    platforms.push(makePlatform(495, 0, 260));

    // 最初の敵は生成待ちにせず、少し先の海流面に置いて早めに見せる。
    // 開幕足場と直近の着地点は空けるので、初手は安全に操作できる。
    shells.push(makeShell(CFG.logicWidth - 84, 360));
    crabs.push(makeCrab(CFG.logicWidth - 170, 360, CFG.logicWidth - 300, CFG.logicWidth - 18));
    sharks.push(makeShark(CFG.logicWidth * 0.70, 505));

    // Player starts exactly on the first platform
    player.x = startPlatform.x + startPlatform.w / 2;
    player.y = startPlatform.y - player.hh;
    player.vy = 0;
    player.vx = 0;
    player.grounded = true;
    player.diveIgnore = 0;
    player.airDiveUsed = false;

    // Camera positioned so surface is visible above and player is comfortably in view
    cameraY = player.y - CFG.logicHeight * 0.45;

    generatedUntil = 610;
    introTimer = CFG.introDuration;
  }

  function difficultyProfile() {
    // 単純な線形ではなく、深度に応じたベース難度 + ゆるい波 + ランダムな小変化。
    const depthScroll = maxScroll / CFG.scrollUnit;
    const t = Math.min(1, playTime / 150);
    const smooth = t * t * (3 - 2 * t);
    const wave = 0.08 * Math.sin(playTime * 0.23) + 0.05 * Math.sin(depthScroll * 0.71);
    return Math.max(0, Math.min(1, smooth + wave));
  }

  function platformOverlaps(pl, arr) {
    return arr.some(o => Math.abs(o.y - pl.y) < 22 && pl.x < o.x + o.w + 18 && pl.x + pl.w + 18 > o.x);
  }

  function addPlatformIfClear(arr, pl) {
    if (!platformOverlaps(pl, arr)) arr.push(pl);
  }

  function generateUntil(targetY) {
    while (generatedUntil < targetY) {
      const difficulty = difficultyProfile();
      const depthScroll = maxScroll / CFG.scrollUnit;
      const early = playTime < CFG.safeStartTime;
      const spacingMin = early ? 82 : 72 - difficulty * 18;
      const spacingMax = early ? 118 : 132 - difficulty * 24;
      const spacing = spacingMin + Math.random() * (spacingMax - spacingMin);
      const y = generatedUntil + spacing;

      // その区間で必ず到達できる安全足場を1つ作る。
      const safeW = early ? 230 + Math.random() * 90 : 165 + Math.random() * (90 - difficulty * 30);
      const safeBias = 0.5 + Math.sin(depthScroll * 0.9) * 0.22;
      let safeX = safeBias * (CFG.logicWidth - safeW) + (Math.random() - 0.5) * 120;
      safeX = Math.max(0, Math.min(CFG.logicWidth - safeW, safeX));

      // ときどき画面端にくっつく海流面を出す。初期も安心できるよう片側接続を混ぜる。
      const edgeChance = early ? 0.28 : 0.22 + difficulty * 0.13;
      if (Math.random() < edgeChance) {
        const edgeLeft = Math.random() < 0.5;
        safeX = edgeLeft ? 0 : CFG.logicWidth - safeW;
      }

      const segPlatforms = [];
      segPlatforms.push(makePlatform(y, safeX, safeW));

      // 追加足場。深度帯で雰囲気を変える。
      const band = Math.floor(depthScroll / 8) % 4; // 0:穏やか 1:広め 2:端寄せ 3:散らし
      let extraCount = early ? 1 : 1 + Math.floor(Math.random() * (2 + difficulty * 2));
      if (band === 1 && !early) extraCount += 1;
      if (band === 3 && Math.random() < 0.45) extraCount += 1;

      for (let i = 0; i < extraCount; i++) {
        let pw = early ? 180 + Math.random() * 120 : 90 + Math.random() * (160 - difficulty * 35);
        let px;
        if (band === 2 && Math.random() < 0.55) {
          px = Math.random() < 0.5 ? 0 : CFG.logicWidth - pw;
        } else {
          px = Math.random() * (CFG.logicWidth - pw);
        }
        addPlatformIfClear(segPlatforms, makePlatform(y + (Math.random() - 0.5) * 20, px, pw));
      }

      platforms.push(...segPlatforms);

      // 障害物：2秒後すぎから出す。安全足場は塞ぎ切らない。
      segPlatforms.forEach((pl, idx) => {
        if (playTime < CFG.firstEnemyTime) return;
        if (idx === 0 && Math.random() < 0.80) return;
        const shellChance = 0.22 + difficulty * 0.24 + (band === 1 ? 0.06 : 0);
        if (Math.random() < shellChance && pl.w > 80) {
          const sx = pl.x + 28 + Math.random() * Math.max(1, pl.w - 56);
          const sy = pl.y - 10;
          shells.push(makeShell(sx, sy));
        }
      });

      // カニ：2秒台から登場。安全足場には出しにくくする。
      segPlatforms.forEach((pl, idx) => {
        if (playTime < CFG.firstCrabTime) return;
        if (idx === 0 && Math.random() < 0.66) return;
        if (pl.w > 110 && Math.random() < 0.18 + difficulty * 0.20) {
          const cx = pl.x + 18 + Math.random() * Math.max(1, pl.w - 36);
          const cy = pl.y - 10;
          crabs.push(makeCrab(cx, cy, pl.x + 10, pl.x + pl.w - 10));
        }
      });

      // サメ：スクロールが遅いので2秒台後半から登場。ただし序盤は低密度。
      if (playTime > CFG.firstSharkTime) {
        const sharkChance = 0.12 + difficulty * 0.24 + (band === 3 ? 0.08 : 0);
        if (Math.random() < sharkChance) {
          const sx = 40 + Math.random() * (CFG.logicWidth - 80);
          const sy = y - 30 - Math.random() * 85;
          if (!player || Math.hypot(sx - player.x, sy - player.y) > CFG.enemySafeDist) {
            sharks.push(makeShark(sx, sy));
          }
        }
      }

      // クジラ：中盤から出る巨大な移動障害。遅くて予測しやすいが、画面支配力が高い。
      if (playTime > CFG.firstWhaleTime) {
        const whaleChance = 0.035 + difficulty * 0.09 + (band === 2 ? 0.025 : 0);
        if (Math.random() < whaleChance) {
          const wx = 90 + Math.random() * (CFG.logicWidth - 180);
          const wy = y - 55 - Math.random() * 110;
          if (!player || Math.hypot(wx - player.x, wy - player.y) > CFG.enemySafeDist + CFG.whaleRadius) {
            whales.push(makeWhale(wx, wy));
          }
        }
      }

      generatedUntil = y;
    }
  }

  function cleanup(yTop) {
    const margin = 200;
    platforms = platforms.filter(p => p.y > yTop - margin);
    shells = shells.filter(s => s.y > yTop - margin && s.active);
    crabs = crabs.filter(c => c.y > yTop - margin && c.active);
    sharks = sharks.filter(s => s.y > yTop - margin);
    whales = whales.filter(w => w.y > yTop - margin && w.y < yTop + CFG.logicHeight + 260);
  }

  function playerHitRadius() {
    // 見た目の魚30pxに対して、中心から約14pxを衝突半径にする。
    // 「触れて見えるのに当たらない」を減らしつつ、発光や余白までは拾わない。
    return Math.max(8, CFG.playerW / 2 - CFG.playerHitShrink);
  }

  // ===== Physics =====
  function updatePhysics(dt) {
    if (!player) return;
    const p = player;

    p.vy += scaled(CFG.gravity) * dt;

    const left = keys.has("b");
    const right = keys.has("f");
    if (p.grounded) {
      if (left && !right) {
        p.vx -= scaled(CFG.moveAccel) * dt;
        p.facing = -1;
      } else if (right && !left) {
        p.vx += scaled(CFG.moveAccel) * dt;
        p.facing = 1;
      } else {
        p.vx *= CFG.friction;
      }
      if (p.vx > scaled(CFG.maxRunSpeed)) p.vx = scaled(CFG.maxRunSpeed);
      if (p.vx < -scaled(CFG.maxRunSpeed)) p.vx = -scaled(CFG.maxRunSpeed);
    } else {
      p.vx *= CFG.airDrag;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.diveIgnore > 0) p.diveIgnore -= dt;

    if (p.x < p.hw) { p.x = p.hw; p.vx = 0; }
    if (p.x > CFG.logicWidth - p.hw) { p.x = CFG.logicWidth - p.hw; p.vx = 0; }

    p.grounded = false;
    if (p.vy >= 0) {
      const prevY = p.y - p.vy * dt;
      for (const pl of platforms) {
        if (p.diveIgnore > 0) continue;
        const platTop = pl.y;
        const wasAbove = (prevY + p.hh) <= platTop + 1;
        const nowOnOrBelow = (p.y + p.hh) >= platTop;
        const withinX = p.x + p.hw - CFG.playerHitShrink > pl.x && p.x - p.hw + CFG.playerHitShrink < pl.x + pl.w;
        if (wasAbove && nowOnOrBelow && withinX) {
          p.y = platTop - p.hh;
          p.vy = 0;
          p.grounded = true;
          p.airDiveUsed = false;
          break;
        }
      }
    }

    if (state === "playing" && introTimer <= 0 && !p.invuln) {
      for (const s of shells) {
        if (!s.active) continue;
        const dx = p.x - s.x;
        const dy = p.y - s.y;
        const rr = playerHitRadius() + s.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
      for (const sh of sharks) {
        const dx = p.x - sh.x;
        const dy = p.y - sh.y;
        const rr = playerHitRadius() + sh.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
      for (const wh of whales) {
        const dx = p.x - wh.x;
        const dy = p.y - wh.y;
        // 見た目は巨大だが、当たり判定はやや小さくして理不尽さを抑える。
        const rr = playerHitRadius() + wh.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
      for (const c of crabs) {
        if (!c.active) continue;
        const dx = p.x - c.x;
        const dy = p.y - c.y;
        const rr = playerHitRadius() + c.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
    }
  }

  function updateDeathFish(dt) {
    if (!deathFish) return;
    deathFish.vy += scaled(CFG.gameOverFallGravity) * dt;
    deathFish.x += deathFish.vx * dt;
    deathFish.y += deathFish.vy * dt;
    deathFish.rot += deathFish.vr * dt;
    deathFish.life = Math.max(0, deathFish.life - dt * 0.22);

    // 画面下へ落ちた後は、見えない位置で止めて無駄な数値発散を避ける。
    const bottom = cameraY + CFG.logicHeight + 90;
    if (deathFish.y > bottom) {
      deathFish.y = bottom;
      deathFish.vy = 0;
      deathFish.vx *= 0.92;
      deathFish.vr *= 0.92;
    }
  }

  function updateEntities(dt) {
    for (const sh of sharks) {
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.turnTimer -= dt;
      if (sh.turnTimer <= 0) {
        sh.turnTimer = 1 + Math.random() * 2;
        sh.vx += (Math.random() - 0.5) * 60;
        sh.vy += (Math.random() - 0.5) * 40;
        const maxSX = 140, maxSY = 80;
        if (sh.vx > maxSX) sh.vx = maxSX;
        if (sh.vx < -maxSX) sh.vx = -maxSX;
        if (sh.vy > maxSY) sh.vy = maxSY;
        if (sh.vy < -maxSY) sh.vy = -maxSY;
      }
      if (sh.x < 20) { sh.x = 20; sh.vx = Math.abs(sh.vx); }
      if (sh.x > CFG.logicWidth - 20) { sh.x = CFG.logicWidth - 20; sh.vx = -Math.abs(sh.vx); }
      if (sh.y < cameraY + 20) { sh.y = cameraY + 20; sh.vy = Math.abs(sh.vy); }
      if (sh.y > cameraY + CFG.logicHeight - 20) { sh.y = cameraY + CFG.logicHeight - 20; sh.vy = -Math.abs(sh.vy); }
      sh.facing = sh.vx >= 0 ? 1 : -1;
    }

    for (const wh of whales) {
      wh.bob += dt * 1.2;
      wh.x += wh.vx * dt;
      wh.y += (wh.vy + Math.sin(wh.bob) * 10) * dt;
      wh.turnTimer -= dt;
      if (wh.turnTimer <= 0) {
        wh.turnTimer = 2.2 + Math.random() * 2.8;
        wh.vx += (Math.random() - 0.5) * 24;
        wh.vy += (Math.random() - 0.5) * 14;
        const maxWX = 58, maxWY = 28;
        if (wh.vx > maxWX) wh.vx = maxWX;
        if (wh.vx < -maxWX) wh.vx = -maxWX;
        if (wh.vy > maxWY) wh.vy = maxWY;
        if (wh.vy < -maxWY) wh.vy = -maxWY;
      }
      if (wh.x < 70) { wh.x = 70; wh.vx = Math.abs(wh.vx); }
      if (wh.x > CFG.logicWidth - 70) { wh.x = CFG.logicWidth - 70; wh.vx = -Math.abs(wh.vx); }
      if (wh.y < cameraY + 50) { wh.y = cameraY + 50; wh.vy = Math.abs(wh.vy); }
      if (wh.y > cameraY + CFG.logicHeight - 50) { wh.y = cameraY + CFG.logicHeight - 50; wh.vy = -Math.abs(wh.vy); }
      wh.facing = wh.vx >= 0 ? 1 : -1;
    }

    for (const c of crabs) {
      c.x += c.vx * dt;
      if (c.x < c.left) { c.x = c.left; c.vx = Math.abs(c.vx); }
      if (c.x > c.right) { c.x = c.right; c.vx = -Math.abs(c.vx); }
    }

    for (const b of bubbles) {
      b.y -= b.speed * dt;
      b.x += Math.sin(b.wobble + playTime * 2) * 0.5;
      b.wobble += dt * 2;
      if (b.y < cameraY - 10) {
        b.y = cameraY + CFG.logicHeight + 10;
        b.x = Math.random() * CFG.logicWidth;
      }
    }

    if (topDanger > 0) {
      for (const b of dangerBubbles) {
        b.y -= b.speed * dt;
        b.x += Math.sin(b.wobble + playTime * 3) * 0.8;
        b.wobble += dt * 2.4;
        if (b.y < -80) {
          b.y = 16 + Math.random() * 42;
          b.x = Math.random() * CFG.logicWidth;
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 30 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function updateCameraAndScroll(dt) {
    if (state !== "playing") return;
    scrollSpeed += CFG.scrollRamp * dt * 60;
    if (scrollSpeed > CFG.scrollMax) scrollSpeed = CFG.scrollMax;

    const dy = scrollSpeed * dt;
    cameraY += dy;
    worldScroll += dy;
    if (worldScroll > maxScroll) maxScroll = worldScroll;

    const screenY = player.y - cameraY;
    // 魚が画面上へ隠れたら即終了ではなく、少しだけ猶予を残す。
    // その間は魚本体ではなく、上端の泡で危険状態を示す。
    topDanger = Math.max(0, Math.min(1, -screenY / CFG.cameraMarginTop));
    if (screenY < -CFG.cameraMarginTop) { gameOver(); return; }
    if (screenY > CFG.logicHeight + CFG.cameraMarginBottom) { gameOver(); return; }
  }

  // ===== Game flow =====
  function startGame() {
    resetWorld();
    // 短い開始演出だけ挟み、長い操作不能時間をなくす。
    state = "intro";
    startBannerTimer = CFG.startBannerTime;
    invulnTimer = CFG.startInvulnTime;
    if (player) {
      player.invuln = true;
      spawnSplash(player.x, player.y - player.hh - 8);
    }
    setFocus(true);
  }

  function gameOver() {
    if (state === "gameover") return;
    state = "gameover";
    shake = 0.35;
    dim = 0.7;
    if (player) {
      deathFish = {
        x: player.x,
        y: player.y,
        vx: Math.max(-160, Math.min(160, player.vx * 0.55 + (Math.random() - 0.5) * 80)),
        vy: -120,
        rot: 0,
        vr: (Math.random() < 0.5 ? -1 : 1) * CFG.gameOverFallSpin,
        facing: player.facing || 1,
        life: 1,
      };
      spawnDeathBubbles(player.x, player.y);
    }
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    const best = Math.floor(bestDepth / CFG.scrollUnit);
    if (depth > best) {
      bestDepth = maxScroll;
      saveBest();
    }
  }

  // ===== Drawing =====
  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, CFG.logicHeight);
    grad.addColorStop(0, "#0a2e5c");
    grad.addColorStop(1, "#020714");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    const surfaceScreenY = 0 - cameraY;
    if (surfaceScreenY > -20 && surfaceScreenY < CFG.logicHeight + 20) {
      ctx.fillStyle = "rgba(120,210,255,0.25)";
      ctx.fillRect(0, surfaceScreenY, CFG.logicWidth, 6);
      ctx.fillStyle = "rgba(180,240,255,0.15)";
      ctx.fillRect(0, surfaceScreenY + 6, CFG.logicWidth, 18);
    }
  }

  function drawBubbles() {
    // 通常プレイ中、魚が見えている時の常時泡は情報量が増えるだけなので抑える。
    // タイトル・ゲームオーバー・上部アウト猶予中だけ泡を意味のある表示として使う。
    if (state === "playing" && topDanger <= 0) return;

    ctx.save();
    const ambientAlpha = state === "playing" ? 0.12 : 0.35;
    for (const b of bubbles) {
      const sy = b.y - cameraY;
      if (sy < -5 || sy > CFG.logicHeight + 5) continue;
      ctx.globalAlpha = ambientAlpha;
      ctx.fillStyle = "#a8e6ff";
      ctx.beginPath();
      ctx.arc(b.x, sy, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTopDanger() {
    if (state !== "playing" || topDanger <= 0) return;
    ctx.save();
    const alpha = Math.min(1, 0.25 + topDanger * 0.75);

    const grad = ctx.createLinearGradient(0, 0, 0, 96);
    grad.addColorStop(0, `rgba(0, 3, 10, ${0.72 * alpha})`);
    grad.addColorStop(1, "rgba(0, 3, 10, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CFG.logicWidth, 110);

    ctx.fillStyle = `rgba(185, 238, 255, ${0.25 + 0.45 * topDanger})`;
    for (const b of dangerBubbles) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * (0.8 + topDanger * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = "bold 14px sans-serif";
    ctx.fillStyle = `rgba(210, 248, 255, ${alpha})`;
    ctx.shadowColor = "rgba(80, 210, 255, 0.75)";
    ctx.shadowBlur = 10;
    ctx.fillText("上へ流されている", CFG.logicWidth / 2, 14);
    ctx.restore();
  }

  function drawPlatforms() {
    for (const pl of platforms) {
      const sy = pl.y - cameraY;
      if (sy < -30 || sy > CFG.logicHeight + 30) continue;
      ctx.save();
      ctx.shadowColor = "rgba(0, 180, 255, 0.35)";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(10, 80, 140, 0.9)";
      ctx.fillRect(pl.x, sy, pl.w, pl.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(60, 180, 255, 0.25)";
      const flow = (playTime * 40 + pl.flowOffset) % 24;
      for (let i = -24; i < pl.w; i += 24) {
        ctx.fillRect(pl.x + i + flow, sy + 3, 10, 3);
        ctx.fillRect(pl.x + i + flow - 12, sy + 10, 10, 3);
      }
      ctx.fillStyle = "rgba(140, 220, 255, 0.5)";
      ctx.fillRect(pl.x, sy, pl.w, 2);
      ctx.restore();
    }
  }

  function drawShells() {
    ctx.font = CFG.shellEmojiSize + "px sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const s of shells) {
      if (!s.active) continue;
      const sy = s.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      ctx.fillText("🐚", s.x, sy);
    }
  }

  function drawSharks() {
    ctx.font = CFG.sharkEmojiSize + "px sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const sh of sharks) {
      const sy = sh.y - cameraY;
      if (sy < -30 || sy > CFG.logicHeight + 30) continue;
      ctx.save();
      ctx.translate(sh.x, sy);
      if (sh.facing < 0) ctx.scale(-1, 1);
      ctx.fillText("🦈", 0, 0);
      ctx.restore();
    }
  }

  function drawWhales() {
    ctx.font = CFG.whaleEmojiSize + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const wh of whales) {
      const sy = wh.y - cameraY;
      if (sy < -120 || sy > CFG.logicHeight + 120) continue;
      ctx.save();
      ctx.translate(wh.x, sy);
      if (wh.facing < 0) ctx.scale(-1, 1);
      ctx.shadowColor = "rgba(70, 180, 255, 0.32)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#ffffff";
      ctx.fillText("🐋", 0, 0);
      ctx.restore();
    }
  }

  function drawCrabs() {
    ctx.font = CFG.crabEmojiSize + "px sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const c of crabs) {
      if (!c.active) continue;
      const sy = c.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      ctx.fillText("🦀", c.x, sy);
    }
  }

  function drawDeathFish() {
    if (!deathFish) return;
    const sy = deathFish.y - cameraY;
    if (sy < -80 || sy > CFG.logicHeight + 120) return;

    ctx.save();
    ctx.translate(deathFish.x, sy);
    ctx.rotate(deathFish.rot);
    if (deathFish.facing < 0) ctx.scale(-1, 1);
    ctx.globalAlpha = 0.9;
    ctx.font = "bold " + CFG.playerEmojiSize + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(80, 200, 255, 0.55)";
    ctx.shadowBlur = 10;
    ctx.fillText("🐟", 0, 0);

    // やられた感じを出す小さな気泡。
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#b9eeff";
    ctx.beginPath();
    ctx.arc(-10, -18, 2.4, 0, Math.PI * 2);
    ctx.arc(8, -24, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    if (!player) return;
    const sy = player.y - cameraY;
    ctx.save();
    ctx.translate(player.x, sy);

    if (player.invuln || state === "intro") {
      ctx.save();
      ctx.strokeStyle = "rgba(150, 235, 255, 0.75)";
      ctx.lineWidth = 2;
      ctx.shadowColor = "rgba(90, 210, 255, 0.9)";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, CFG.playerEmojiSize * 0.58, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (player.facing < 0) ctx.scale(-1, 1);
    ctx.font = "bold " + CFG.playerEmojiSize + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(80, 200, 255, 0.9)";
    ctx.shadowBlur = 14;
    ctx.fillText("🐟", 0, 0);
    ctx.restore();
  }

  function drawParticles() {
    for (const pt of particles) {
      const sy = pt.y - cameraY;
      ctx.globalAlpha = Math.max(0, pt.life / (pt.maxLife || 1));
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, sy, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    ctx.fillStyle = "rgba(0, 10, 30, 0.6)";
    ctx.fillRect(CFG.logicWidth - 140, 10, 130, 30);
    ctx.strokeStyle = "rgba(100, 200, 255, 0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(CFG.logicWidth - 140, 10, 130, 30);
    ctx.fillStyle = "#c2f0ff";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(depth + " scroll", CFG.logicWidth - 18, 25);

    ctx.fillStyle = "rgba(0, 10, 30, 0.55)";
    ctx.fillRect(10, CFG.logicHeight - 32, 350, 24);
    ctx.strokeStyle = "rgba(100, 200, 255, 0.25)";
    ctx.strokeRect(10, CFG.logicHeight - 32, 350, 24);
    ctx.fillStyle = "#8ecae6";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("B: 左　F: 右　P: ホップ　N: ダイブ　Esc: 一時停止", 18, CFG.logicHeight - 20);
  }

  function drawStartBanner() {
    if (state !== "intro" && startBannerTimer <= 0) return;
    const t = state === "intro" ? Math.max(0, introTimer / CFG.introDuration) : Math.max(0, startBannerTimer / CFG.startBannerTime);
    const alpha = Math.max(0, Math.min(1, t));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(0, 12, 30, 0.35)";
    ctx.fillRect(0, CFG.logicHeight * 0.38, CFG.logicWidth, 84);
    ctx.font = "bold 32px sans-serif";
    ctx.fillStyle = "#e8fbff";
    ctx.shadowColor = "rgba(80, 210, 255, 0.95)";
    ctx.shadowBlur = 18;
    ctx.fillText("🐠  START", CFG.logicWidth / 2, CFG.logicHeight * 0.45);
    ctx.font = "14px sans-serif";
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#9fe7ff";
    ctx.fillText("海流に乗って深海へ", CFG.logicWidth / 2, CFG.logicHeight * 0.53);
    ctx.restore();
  }

  function drawTitle() {
    drawBackground();
    drawBubbles();

    ctx.save();
    ctx.fillStyle = "rgba(0, 6, 18, 0.55)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    ctx.fillStyle = "#e0f7ff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "bold 34px sans-serif";
    ctx.fillText("深海潜行", CFG.logicWidth / 2, CFG.logicHeight * 0.28);

    ctx.font = "16px sans-serif";
    ctx.fillStyle = "#a8d8f0";
    ctx.fillText("深海へ潜り続けよう", CFG.logicWidth / 2, CFG.logicHeight * 0.40);

    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#7eb8d4";
    ctx.fillText("B：左移動　F：右移動", CFG.logicWidth / 2, CFG.logicHeight * 0.52);
    ctx.fillText("P：ホップ　N：ダイブ", CFG.logicWidth / 2, CFG.logicHeight * 0.58);
    ctx.fillText("Enterでスタート", CFG.logicWidth / 2, CFG.logicHeight * 0.68);

    const best = Math.floor(bestDepth / CFG.scrollUnit);
    ctx.fillStyle = "#5c9ebf";
    ctx.fillText("ベスト深度：" + best + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.78);

    if (!focus) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillText("ゲーム画面をクリックして操作", CFG.logicWidth / 2, CFG.logicHeight * 0.88);
    }
    ctx.restore();
  }

  function drawPaused() {
    ctx.save();
    ctx.fillStyle = "rgba(0, 6, 18, 0.65)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    ctx.fillStyle = "#e0f7ff";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("PAUSED", CFG.logicWidth / 2, CFG.logicHeight * 0.45);
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#8ecae6";
    ctx.fillText("Space で再開　Esc でタイトルへ戻る", CFG.logicWidth / 2, CFG.logicHeight * 0.55);
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    if (dim > 0) {
      ctx.fillStyle = `rgba(0, 3, 12, ${dim * 0.85})`;
      ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    }
    ctx.fillStyle = "rgba(0, 6, 18, 0.55)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    ctx.fillStyle = "#ff5c5c";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("GAME OVER", CFG.logicWidth / 2, CFG.logicHeight * 0.32);

    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    const best = Math.floor(bestDepth / CFG.scrollUnit);
    ctx.fillStyle = "#c2f0ff";
    ctx.font = "16px sans-serif";
    ctx.fillText("今回の最大深度：" + depth + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.46);
    ctx.fillStyle = "#8ecae6";
    ctx.fillText("ベスト深度：" + best + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.54);

    ctx.fillStyle = "#a8d8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("Enter / R でもう一度", CFG.logicWidth / 2, CFG.logicHeight * 0.66);
    ctx.fillText("Esc でタイトルへ", CFG.logicWidth / 2, CFG.logicHeight * 0.74);
    ctx.restore();
  }

  function applyShake() {
    if (shake > 0) {
      const intensity = 6;
      const dx = (Math.random() - 0.5) * intensity;
      const dy = (Math.random() - 0.5) * intensity;
      ctx.translate(dx, dy);
    }
  }

  // ===== Main loop =====
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.5) dt = 0.5;

    if (state === "title") {
      drawTitle();
      return;
    }

    const step = CFG.maxDt;
    acc += dt;
    if (acc > CFG.accumulatorMax) acc = CFG.accumulatorMax;

    while (acc >= step) {
      if (state === "intro") {
        introTimer -= step;
        playTime += step;

        if (player && startPlatform) {
          player.x = startPlatform.x + startPlatform.w / 2;
          player.y = startPlatform.y - player.hh;
          player.vx = 0;
          player.vy = 0;
          player.grounded = true;
        }

        // ごく短い演出中だけ、世界をほんの少し動かして潜行開始感を出す。
        const introScroll = scrollSpeed * 0.18 * step;
        cameraY += introScroll;
        worldScroll += introScroll;
        if (worldScroll > maxScroll) maxScroll = worldScroll;

        if (introTimer <= 0) {
          introTimer = 0;
          state = "playing";
          if (player && startPlatform) {
            player.x = startPlatform.x + startPlatform.w / 2;
            player.y = startPlatform.y - player.hh;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
            player.diveIgnore = 0;
            player.airDiveUsed = false;
            player.invuln = true;
            invulnTimer = CFG.startInvulnTime;
          }
        }
      } else if (state === "playing") {
        if (invulnTimer > 0) {
          invulnTimer -= step;
          if (invulnTimer <= 0 && player) {
            invulnTimer = 0;
            player.invuln = false;
          }
        }
        if (startBannerTimer > 0) {
          startBannerTimer -= step;
          if (startBannerTimer < 0) startBannerTimer = 0;
        }
        updatePhysics(step);
        updateCameraAndScroll(step);
        updateEntities(step);
        playTime += step;
        generateUntil(cameraY + CFG.logicHeight + 200);
        cleanup(cameraY);
      } else if (state === "gameover") {
        updateEntities(step);
        updateDeathFish(step);
        if (shake > 0) shake -= step;
        if (dim > 0) dim -= step * 0.3;
        if (dim < 0) dim = 0;
      } else if (state === "paused") {
        // no updates
      }
      acc -= step;
    }

    ctx.save();
    ctx.clearRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    applyShake();
    drawBackground();
    drawBubbles();
    drawPlatforms();
    drawShells();
    drawCrabs();
    drawSharks();
    drawWhales();
    if (state === "gameover") drawDeathFish();
    else drawPlayer();
    drawParticles();
    drawTopDanger();
    drawHUD();
    drawStartBanner();
    ctx.restore();

    // UIオーバーレイは揺らさず読みやすく保つ
    ctx.save();
    if (state === "paused") drawPaused();
    if (state === "gameover") drawGameOver();
    ctx.restore();
  }

  requestAnimationFrame(frame);
})();
</script>
