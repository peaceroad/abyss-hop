<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深海潜行 - Abyss Hop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #020d1f;
    color: #e0f7ff;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 4 / 3;
    background: #000;
    box-shadow: 0 0 40px rgba(0, 150, 255, 0.25);
    border: 2px solid #0b2e4f;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #focus-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 10, 30, 0.85);
    border: 1px solid #1b6f9c;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    color: #8fd7ff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 10;
  }
  #focus-hint.show {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas" tabindex="0"></canvas>
  <div id="focus-hint">ゲーム画面をクリックして操作</div>
</div>
<script>
(() => {
  "use strict";

  // ===== Configuration =====
  const CFG = {
    logicWidth: 800,
    logicHeight: 600,
    gravity: 1800,
    hopVel: -520,
    diveVel: 520,
    moveAccel: 800,
    maxRunSpeed: 220,
    friction: 0.82,
    airDrag: 0.96,
    scrollBase: 90,
    scrollMax: 280,
    scrollRamp: 0.003,
    cameraMarginTop: 160,
    cameraMarginBottom: 60,
    shellRadius: 10,
    sharkRadius: 18,
    crabRadius: 10,
    playerW: 28,
    playerH: 20,
    playerHitShrink: 4,
    introDuration: 1.8,
    safeStartTime: 20,
    diveIgnoreTime: 0.18,
    maxDt: 0.033,
    accumulatorMax: 0.1,
    bubbleCount: 40,
    scrollUnit: 120,
    enemySafeDist: 120,
  };

  // ===== State =====
  const canvas = document.getElementById("gameCanvas");
  const wrapper = document.getElementById("game-wrapper");
  const focusHint = document.getElementById("focus-hint");
  const ctx = canvas.getContext("2d", { alpha: false });

  let state = "title";
  let lastTime = 0;
  let acc = 0;
  let focus = false;
  let bestDepth = 0;
  let shake = 0;
  let dim = 0;

  const keys = new Set();
  const latched = { p: false, n: false };

  let worldScroll = 0;
  let maxScroll = 0;
  let scrollSpeed = CFG.scrollBase;
  let introTimer = 0;
  let playTime = 0;

  let player = null;
  let platforms = [];
  let shells = [];
  let sharks = [];
  let crabs = [];
  let bubbles = [];
  let particles = [];

  let cameraY = 0;
  let generatedUntil = 0;
  let startPlatform = null;

  // ===== localStorage =====
  function loadBest() {
    try {
      const v = localStorage.getItem("abyss_best_depth");
      if (v) bestDepth = Math.max(0, parseInt(v, 10) || 0);
    } catch (e) { bestDepth = 0; }
  }
  function saveBest() {
    try {
      localStorage.setItem("abyss_best_depth", String(bestDepth));
    } catch (e) {}
  }
  loadBest();

  // ===== Resize =====
  function resize() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ===== Focus =====
  function setFocus(v) {
    focus = v;
    if (v) {
      canvas.focus();
      focusHint.classList.remove("show");
    } else {
      focusHint.classList.add("show");
      keys.clear();
      latched.p = false;
      latched.n = false;
      if (state === "playing") state = "paused";
    }
  }
  canvas.addEventListener("focus", () => setFocus(true));
  canvas.addEventListener("blur", () => setFocus(false));
  wrapper.addEventListener("click", () => { setFocus(true); });
  window.addEventListener("blur", () => setFocus(false));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setFocus(false);
  });

  // ===== Input =====
  function codeKey(code) {
    if (code === "KeyB") return "b";
    if (code === "KeyF") return "f";
    if (code === "KeyP") return "p";
    if (code === "KeyN") return "n";
    if (code === "KeyR") return "r";
    if (code === "Enter") return "enter";
    if (code === "Escape") return "esc";
    return null;
  }

  window.addEventListener("keydown", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "b" || k === "f" || k === "enter" || k === "esc" || k === "r") {
      e.preventDefault();
    }
    if (k === "p" || k === "n") {
      e.preventDefault();
      if (e.repeat) return;
      if (k === "p" && !latched.p) { latched.p = true; onPressEdge("p"); }
      if (k === "n" && !latched.n) { latched.n = true; onPressEdge("n"); }
      return;
    }
    keys.add(k);
    if (k === "enter") {
      if (state === "title" || state === "gameover") startGame();
    }
    if (k === "r") {
      if (state === "gameover") startGame();
    }
    if (k === "esc") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
      else if (state === "gameover") state = "title";
    }
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    const k = codeKey(e.code);
    if (!k) return;
    if (k === "p") { latched.p = false; }
    if (k === "n") { latched.n = false; }
    keys.delete(k);
  });

  function onPressEdge(action) {
    if (state !== "playing") return;
    if (!player) return;
    if (action === "p") {
      if (player.grounded) {
        player.vy = CFG.hopVel;
        player.grounded = false;
        spawnHopParticles(player.x, player.y + player.hh);
      }
    } else if (action === "n") {
      if (player.grounded) {
        player.diveIgnore = CFG.diveIgnoreTime;
        player.vy = CFG.diveVel;
        player.grounded = false;
        player.airDiveUsed = false;
      } else if (!player.airDiveUsed) {
        player.vy = CFG.diveVel;
        player.airDiveUsed = true;
      }
    }
  }

  // ===== Entities =====
  function makePlayer() {
    return {
      x: CFG.logicWidth / 2,
      y: 0,
      vx: 0,
      vy: 0,
      hw: CFG.playerW / 2,
      hh: CFG.playerH / 2,
      grounded: false,
      diveIgnore: 0,
      airDiveUsed: false,
      facing: 1,
      invuln: true,
    };
  }

  function makePlatform(y, x, w) {
    return { x, y, w, h: 18, flowOffset: Math.random() * 1000 };
  }

  function makeShell(x, y) {
    return { x, y, r: CFG.shellRadius, active: true };
  }

  function makeShark(x, y) {
    return {
      x, y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 60),
      vy: (Math.random() - 0.5) * 40,
      r: CFG.sharkRadius,
      turnTimer: 1 + Math.random() * 2,
      facing: 1,
    };
  }

  function makeCrab(x, y, left, right) {
    return {
      x, y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 30),
      r: CFG.crabRadius,
      left, right,
      active: true,
    };
  }

  function makeBubble() {
    return {
      x: Math.random() * CFG.logicWidth,
      y: Math.random() * CFG.logicHeight,
      r: 1 + Math.random() * 2.5,
      speed: 20 + Math.random() * 40,
      wobble: Math.random() * Math.PI * 2,
    };
  }

  function spawnHopParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 120,
        vy: Math.random() * 60,
        life: 0.4 + Math.random() * 0.3,
        maxLife: 1,
        r: 1.5 + Math.random() * 2,
        color: "rgba(160,230,255,0.9)",
      });
    }
  }

  function spawnSplash(x, y) {
    for (let i = 0; i < 20; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 200,
        vy: -Math.random() * 180,
        life: 0.8 + Math.random() * 0.5,
        maxLife: 1,
        r: 2 + Math.random() * 3,
        color: "rgba(200,245,255,0.95)",
      });
    }
  }

  function spawnDeathBubbles(x, y) {
    for (let i = 0; i < 30; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 100,
        vy: -20 - Math.random() * 120,
        life: 1.2 + Math.random() * 1.0,
        maxLife: 1,
        r: 2 + Math.random() * 4,
        color: "rgba(180,230,255,0.85)",
      });
    }
  }

  // ===== Generation =====
  function resetWorld() {
    player = makePlayer();
    platforms = [];
    shells = [];
    crabs = [];
    sharks = [];
    bubbles = Array.from({ length: CFG.bubbleCount }, makeBubble);
    particles = [];
    worldScroll = 0;
    maxScroll = 0;
    scrollSpeed = CFG.scrollBase;
    playTime = 0;
    shake = 0;
    dim = 0;

    // First platform: long and safe, place player directly on it
    startPlatform = makePlatform(120, CFG.logicWidth * 0.2, 280);
    platforms.push(startPlatform);
    platforms.push(makePlatform(260, CFG.logicWidth * 0.45, 200));
    platforms.push(makePlatform(400, CFG.logicWidth * 0.15, 240));

    // Player starts exactly on the first platform
    player.x = startPlatform.x + startPlatform.w / 2;
    player.y = startPlatform.y - player.hh;
    player.vy = 0;
    player.vx = 0;
    player.grounded = true;
    player.diveIgnore = 0;
    player.airDiveUsed = false;

    // Camera positioned so surface is visible above and player is comfortably in view
    cameraY = player.y - CFG.logicHeight * 0.45;

    generatedUntil = 520;
    introTimer = CFG.introDuration;
  }

  function generateUntil(targetY) {
    while (generatedUntil < targetY) {
      const difficulty = Math.min(1, playTime / 120);
      const spacingMin = 70 - difficulty * 20;
      const spacingMax = 130 - difficulty * 25;
      const spacing = spacingMin + Math.random() * (spacingMax - spacingMin);
      const y = generatedUntil + spacing;

      const count = 1 + Math.floor(Math.random() * 2) + Math.floor(difficulty * 2);
      const segPlatforms = [];
      for (let i = 0; i < count; i++) {
        const pw = 80 + Math.random() * (180 - difficulty * 40);
        const px = Math.random() * (CFG.logicWidth - pw);
        segPlatforms.push(makePlatform(y, px, pw));
      }

      if (segPlatforms.length > 0) {
        const safe = segPlatforms[0];
        safe.x = Math.max(0, Math.min(CFG.logicWidth - safe.w, CFG.logicWidth * 0.35 + (Math.random() - 0.5) * 200));
        safe.w = Math.max(160, safe.w);
      }

      platforms.push(...segPlatforms);

      segPlatforms.forEach((pl, idx) => {
        if (idx === 0 && playTime < 8) return;
        if (Math.random() < 0.35) {
          const sx = pl.x + 20 + Math.random() * (pl.w - 40);
          const sy = pl.y - 10;
          shells.push(makeShell(sx, sy));
        }
      });

      segPlatforms.forEach((pl) => {
        if (Math.random() < 0.25 + difficulty * 0.15) {
          const cx = pl.x + 10 + Math.random() * (pl.w - 20);
          const cy = pl.y - 10;
          crabs.push(makeCrab(cx, cy, pl.x + 6, pl.x + pl.w - 6));
        }
      });

      if (playTime > 6) {
        const sharkChance = 0.15 + difficulty * 0.25;
        if (Math.random() < sharkChance) {
          const sx = 40 + Math.random() * (CFG.logicWidth - 80);
          const sy = y - 20 - Math.random() * 60;
          if (Math.hypot(sx - player.x, sy - (player.y + cameraY)) > CFG.enemySafeDist) {
            sharks.push(makeShark(sx, sy));
          }
        }
      }

      generatedUntil = y;
    }
  }

  function cleanup(yTop) {
    const margin = 200;
    platforms = platforms.filter(p => p.y > yTop - margin);
    shells = shells.filter(s => s.y > yTop - margin && s.active);
    crabs = crabs.filter(c => c.y > yTop - margin && c.active);
    sharks = sharks.filter(s => s.y > yTop - margin);
  }

  // ===== Physics =====
  function updatePhysics(dt) {
    if (!player) return;
    const p = player;

    p.vy += CFG.gravity * dt;

    const left = keys.has("b");
    const right = keys.has("f");
    if (p.grounded) {
      if (left && !right) {
        p.vx -= CFG.moveAccel * dt;
        p.facing = -1;
      } else if (right && !left) {
        p.vx += CFG.moveAccel * dt;
        p.facing = 1;
      } else {
        p.vx *= CFG.friction;
      }
      if (p.vx > CFG.maxRunSpeed) p.vx = CFG.maxRunSpeed;
      if (p.vx < -CFG.maxRunSpeed) p.vx = -CFG.maxRunSpeed;
    } else {
      p.vx *= CFG.airDrag;
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.diveIgnore > 0) p.diveIgnore -= dt;

    if (p.x < p.hw) { p.x = p.hw; p.vx = 0; }
    if (p.x > CFG.logicWidth - p.hw) { p.x = CFG.logicWidth - p.hw; p.vx = 0; }

    p.grounded = false;
    if (p.vy >= 0) {
      const prevY = p.y - p.vy * dt;
      for (const pl of platforms) {
        if (p.diveIgnore > 0) continue;
        const platTop = pl.y;
        const wasAbove = (prevY + p.hh) <= platTop + 1;
        const nowOnOrBelow = (p.y + p.hh) >= platTop;
        const withinX = p.x + p.hw - CFG.playerHitShrink > pl.x && p.x - p.hw + CFG.playerHitShrink < pl.x + pl.w;
        if (wasAbove && nowOnOrBelow && withinX) {
          p.y = platTop - p.hh;
          p.vy = 0;
          p.grounded = true;
          p.airDiveUsed = false;
          break;
        }
      }
    }

    if (state === "playing" && introTimer <= 0) {
      for (const s of shells) {
        if (!s.active) continue;
        const dx = p.x - s.x;
        const dy = p.y - s.y;
        const rr = (CFG.playerW / 2 - CFG.playerHitShrink) + s.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
      for (const sh of sharks) {
        const dx = p.x - sh.x;
        const dy = p.y - sh.y;
        const rr = (CFG.playerW / 2 - CFG.playerHitShrink) + sh.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
      for (const c of crabs) {
        if (!c.active) continue;
        const dx = p.x - c.x;
        const dy = p.y - c.y;
        const rr = (CFG.playerW / 2 - CFG.playerHitShrink) + c.r;
        if (dx * dx + dy * dy < rr * rr) {
          gameOver();
          return;
        }
      }
    }
  }

  function updateEntities(dt) {
    for (const sh of sharks) {
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.turnTimer -= dt;
      if (sh.turnTimer <= 0) {
        sh.turnTimer = 1 + Math.random() * 2;
        sh.vx += (Math.random() - 0.5) * 60;
        sh.vy += (Math.random() - 0.5) * 40;
        const maxSX = 140, maxSY = 80;
        if (sh.vx > maxSX) sh.vx = maxSX;
        if (sh.vx < -maxSX) sh.vx = -maxSX;
        if (sh.vy > maxSY) sh.vy = maxSY;
        if (sh.vy < -maxSY) sh.vy = -maxSY;
      }
      if (sh.x < 20) { sh.x = 20; sh.vx = Math.abs(sh.vx); }
      if (sh.x > CFG.logicWidth - 20) { sh.x = CFG.logicWidth - 20; sh.vx = -Math.abs(sh.vx); }
      if (sh.y < cameraY + 20) { sh.y = cameraY + 20; sh.vy = Math.abs(sh.vy); }
      if (sh.y > cameraY + CFG.logicHeight - 20) { sh.y = cameraY + CFG.logicHeight - 20; sh.vy = -Math.abs(sh.vy); }
      sh.facing = sh.vx >= 0 ? 1 : -1;
    }

    for (const c of crabs) {
      c.x += c.vx * dt;
      if (c.x < c.left) { c.x = c.left; c.vx = Math.abs(c.vx); }
      if (c.x > c.right) { c.x = c.right; c.vx = -Math.abs(c.vx); }
    }

    for (const b of bubbles) {
      b.y -= b.speed * dt;
      b.x += Math.sin(b.wobble + playTime * 2) * 0.5;
      b.wobble += dt * 2;
      if (b.y < cameraY - 10) {
        b.y = cameraY + CFG.logicHeight + 10;
        b.x = Math.random() * CFG.logicWidth;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 30 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function updateCameraAndScroll(dt) {
    if (state !== "playing") return;
    scrollSpeed += CFG.scrollRamp * dt * 60;
    if (scrollSpeed > CFG.scrollMax) scrollSpeed = CFG.scrollMax;

    const dy = scrollSpeed * dt;
    cameraY += dy;
    worldScroll += dy;
    if (worldScroll > maxScroll) maxScroll = worldScroll;

    const screenY = player.y - cameraY;
    if (screenY < -CFG.cameraMarginTop) { gameOver(); return; }
    if (screenY > CFG.logicHeight + CFG.cameraMarginBottom) { gameOver(); return; }
  }

  // ===== Game flow =====
  function startGame() {
    resetWorld();
    state = "intro";
    setFocus(true);
  }

  function gameOver() {
    if (state === "gameover") return;
    state = "gameover";
    shake = 0.35;
    dim = 0.7;
    spawnDeathBubbles(player.x, player.y);
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    const best = Math.floor(bestDepth / CFG.scrollUnit);
    if (depth > best) {
      bestDepth = maxScroll;
      saveBest();
    }
  }

  // ===== Drawing =====
  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, CFG.logicHeight);
    grad.addColorStop(0, "#0a2e5c");
    grad.addColorStop(1, "#020714");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    const surfaceScreenY = 0 - cameraY;
    if (surfaceScreenY > -20 && surfaceScreenY < CFG.logicHeight + 20) {
      ctx.fillStyle = "rgba(120,210,255,0.25)";
      ctx.fillRect(0, surfaceScreenY, CFG.logicWidth, 6);
      ctx.fillStyle = "rgba(180,240,255,0.15)";
      ctx.fillRect(0, surfaceScreenY + 6, CFG.logicWidth, 18);
    }
  }

  function drawBubbles() {
    ctx.save();
    for (const b of bubbles) {
      const sy = b.y - cameraY;
      if (sy < -5 || sy > CFG.logicHeight + 5) continue;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#a8e6ff";
      ctx.beginPath();
      ctx.arc(b.x, sy, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPlatforms() {
    for (const pl of platforms) {
      const sy = pl.y - cameraY;
      if (sy < -30 || sy > CFG.logicHeight + 30) continue;
      ctx.save();
      ctx.shadowColor = "rgba(0, 180, 255, 0.35)";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(10, 80, 140, 0.9)";
      ctx.fillRect(pl.x, sy, pl.w, pl.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(60, 180, 255, 0.25)";
      const flow = (playTime * 40 + pl.flowOffset) % 24;
      for (let i = -24; i < pl.w; i += 24) {
        ctx.fillRect(pl.x + i + flow, sy + 3, 10, 3);
        ctx.fillRect(pl.x + i + flow - 12, sy + 10, 10, 3);
      }
      ctx.fillStyle = "rgba(140, 220, 255, 0.5)";
      ctx.fillRect(pl.x, sy, pl.w, 2);
      ctx.restore();
    }
  }

  function drawShells() {
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const s of shells) {
      if (!s.active) continue;
      const sy = s.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      ctx.fillText("🐚", s.x, sy);
    }
  }

  function drawSharks() {
    ctx.font = "22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const sh of sharks) {
      const sy = sh.y - cameraY;
      if (sy < -30 || sy > CFG.logicHeight + 30) continue;
      ctx.save();
      ctx.translate(sh.x, sy);
      if (sh.facing < 0) ctx.scale(-1, 1);
      ctx.fillText("🦈", 0, 0);
      ctx.restore();
    }
  }

  function drawCrabs() {
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const c of crabs) {
      if (!c.active) continue;
      const sy = c.y - cameraY;
      if (sy < -20 || sy > CFG.logicHeight + 20) continue;
      ctx.fillText("🦀", c.x, sy);
    }
  }

  function drawPlayer() {
    if (!player) return;
    const sy = player.y - cameraY;
    ctx.save();
    ctx.translate(player.x, sy);
    if (player.facing < 0) ctx.scale(-1, 1);
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // 明示的に明るい色を設定（前フレームのfillStyleが残ると暗くなる）
    ctx.fillStyle = "#ffffff";
    // 発光効果で視認性を向上
    ctx.shadowColor = "rgba(80, 200, 255, 0.9)";
    ctx.shadowBlur = 14;
    ctx.fillText("🐟", 0, 0);
    ctx.restore();
  }

  function drawParticles() {
    for (const pt of particles) {
      const sy = pt.y - cameraY;
      ctx.globalAlpha = Math.max(0, pt.life / (pt.maxLife || 1));
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, sy, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    ctx.fillStyle = "rgba(0, 10, 30, 0.6)";
    ctx.fillRect(CFG.logicWidth - 140, 10, 130, 30);
    ctx.strokeStyle = "rgba(100, 200, 255, 0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(CFG.logicWidth - 140, 10, 130, 30);
    ctx.fillStyle = "#c2f0ff";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(depth + " scroll", CFG.logicWidth - 18, 25);

    ctx.fillStyle = "rgba(0, 10, 30, 0.55)";
    ctx.fillRect(10, CFG.logicHeight - 32, 280, 24);
    ctx.strokeStyle = "rgba(100, 200, 255, 0.25)";
    ctx.strokeRect(10, CFG.logicHeight - 32, 280, 24);
    ctx.fillStyle = "#8ecae6";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("B: 左　F: 右　P: ホップ　N: ダイブ", 18, CFG.logicHeight - 20);
  }

  function drawTitle() {
    drawBackground();
    drawBubbles();

    ctx.save();
    ctx.fillStyle = "rgba(0, 6, 18, 0.55)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    ctx.fillStyle = "#e0f7ff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "bold 34px sans-serif";
    ctx.fillText("深海潜行", CFG.logicWidth / 2, CFG.logicHeight * 0.28);

    ctx.font = "16px sans-serif";
    ctx.fillStyle = "#a8d8f0";
    ctx.fillText("深海へ潜り続けよう", CFG.logicWidth / 2, CFG.logicHeight * 0.40);

    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#7eb8d4";
    ctx.fillText("B：左移動　F：右移動", CFG.logicWidth / 2, CFG.logicHeight * 0.52);
    ctx.fillText("P：ホップ　N：ダイブ", CFG.logicWidth / 2, CFG.logicHeight * 0.58);
    ctx.fillText("Enter または クリック スタート", CFG.logicWidth / 2, CFG.logicHeight * 0.68);

    const best = Math.floor(bestDepth / CFG.scrollUnit);
    ctx.fillStyle = "#5c9ebf";
    ctx.fillText("ベスト深度：" + best + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.78);

    if (!focus) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillText("ゲーム画面をクリックして操作", CFG.logicWidth / 2, CFG.logicHeight * 0.88);
    }
    ctx.restore();
  }

  function drawPaused() {
    ctx.save();
    ctx.fillStyle = "rgba(0, 6, 18, 0.65)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    ctx.fillStyle = "#e0f7ff";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("PAUSED", CFG.logicWidth / 2, CFG.logicHeight * 0.45);
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#8ecae6";
    ctx.fillText("Esc で再開　Esc でタイトルへ戻る", CFG.logicWidth / 2, CFG.logicHeight * 0.55);
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    if (dim > 0) {
      ctx.fillStyle = `rgba(0, 3, 12, ${dim * 0.85})`;
      ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    }
    ctx.fillStyle = "rgba(0, 6, 18, 0.55)";
    ctx.fillRect(0, 0, CFG.logicWidth, CFG.logicHeight);

    ctx.fillStyle = "#ff5c5c";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("GAME OVER", CFG.logicWidth / 2, CFG.logicHeight * 0.32);

    const depth = Math.floor(maxScroll / CFG.scrollUnit);
    const best = Math.floor(bestDepth / CFG.scrollUnit);
    ctx.fillStyle = "#c2f0ff";
    ctx.font = "16px sans-serif";
    ctx.fillText("今回の最大深度：" + depth + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.46);
    ctx.fillStyle = "#8ecae6";
    ctx.fillText("ベスト深度：" + best + " scroll", CFG.logicWidth / 2, CFG.logicHeight * 0.54);

    ctx.fillStyle = "#a8d8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText("Enter / R でもう一度", CFG.logicWidth / 2, CFG.logicHeight * 0.66);
    ctx.fillText("Esc でタイトルへ", CFG.logicWidth / 2, CFG.logicHeight * 0.74);
    ctx.restore();
  }

  function applyShake() {
    if (shake > 0) {
      const intensity = 6;
      const dx = (Math.random() - 0.5) * intensity;
      const dy = (Math.random() - 0.5) * intensity;
      ctx.translate(dx, dy);
    }
  }

  // ===== Main loop =====
  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.5) dt = 0.5;

    if (state === "title") {
      drawTitle();
      return;
    }

    const step = CFG.maxDt;
    acc += dt;
    if (acc > CFG.accumulatorMax) acc = CFG.accumulatorMax;

    while (acc >= step) {
      if (state === "intro") {
        introTimer -= step;
        playTime += step;

        if (player) {
          // Keep player firmly on start platform during intro
          if (startPlatform) {
            player.x = startPlatform.x + startPlatform.w / 2;
            player.y = startPlatform.y - player.hh;
            player.vx = 0;
            player.vy = 0;
            player.grounded = true;
          }
          // Gentle idle hover animation
          player.y += Math.sin(playTime * 4) * 0.4 * step;
        }

        // Camera slowly scrolls down to create "diving" feel
        const introScroll = scrollSpeed * 0.35 * step;
        cameraY += introScroll;
        worldScroll += introScroll;
        if (worldScroll > maxScroll) maxScroll = worldScroll;

        if (introTimer <= 0) {
          introTimer = 0;
          state = "playing";
          if (player) {
            player.invuln = false;
            // Ensure clean state when control begins
            if (startPlatform) {
              player.x = startPlatform.x + startPlatform.w / 2;
              player.y = startPlatform.y - player.hh;
              player.vx = 0;
              player.vy = 0;
              player.grounded = true;
              player.diveIgnore = 0;
              player.airDiveUsed = false;
            }
          }
        }
      } else if (state === "playing") {
        updatePhysics(step);
        updateCameraAndScroll(step);
        updateEntities(step);
        playTime += step;
        generateUntil(cameraY + CFG.logicHeight + 200);
        cleanup(cameraY);
      } else if (state === "gameover") {
        updateEntities(step);
        if (shake > 0) shake -= step;
        if (dim > 0) dim -= step * 0.3;
        if (dim < 0) dim = 0;
      } else if (state === "paused") {
        // no updates
      }
      acc -= step;
    }

    ctx.save();
    ctx.clearRect(0, 0, CFG.logicWidth, CFG.logicHeight);
    drawBackground();
    drawBubbles();
    drawPlatforms();
    drawShells();
    drawCrabs();
    drawSharks();
    drawPlayer();
    drawParticles();
    drawHUD();
    applyShake();
    if (state === "paused") drawPaused();
    if (state === "gameover") drawGameOver();
    ctx.restore();
  }

  requestAnimationFrame(frame);
})();
</script>
